<script type="module">
// マイクラ式の地形（洞窟つき）のデモ。地形を作る所は ../js/worldgen.js（Web Worker でも同じファイルを使う）。

const TOUCH = matchMedia('(pointer: coarse)').matches;

const U = {
  uSun: { value: new THREE.Vector3(0.45, 0.85, 0.3).normalize() },

attribute float sky; varying vec3 vC; varying vec3 vN; varying vec3 vW; varying float vSky; varying float vOre;
void main() { vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; vN = normal; vC = color; float s = sky * 255.0 + 0.5; vOre = mod(floor(s), 2.0); vSky = floor(s / 60.0) / 4.0; gl_Position = projectionMatrix * viewMatrix * w; }`;
const FS = (kind) => `
uniform vec3 uSun; uniform float uSkyK; uniform vec3 uFogC; uniform float uFogN; uniform float uFogF; uniform vec4 uLP[${NL}]; uniform vec3 uLC[${NL}]; uniform float uTime; uniform vec3 uAmb;
${xrayGLSL.pars}
varying vec3 vC; varying vec3 vN; varying vec3 vW; varying float vSky; varying float vOre;
float h3(vec3 p) { return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }
void main() {

  col *= 0.9 + 0.18 * h3(cell);
  // ブロックの境の線（面の向きの軸は使わない）
  vec3 a = abs(vN);
  float e = 1.0;
  if (a.x < 0.5) e = min(e, min(f.x, 1.0 - f.x));
  if (a.y < 0.5) e = min(e, min(f.y, 1.0 - f.y));
  if (a.z < 0.5) e = min(e, min(f.z, 1.0 - f.z));

  float fl = 0.85 + 0.15 * sin(uTime * 2.0 + h3(cell) * 6.0);
  vec3 c = mix(vec3(1.0, 0.35, 0.05), vec3(1.0, 0.8, 0.2), h3(floor(vW * 2.0) + floor(uTime))) * fl * 1.3;

  float face = a.y > 0.5 ? (vN.y > 0.0 ? 1.0 : 0.55) : (a.x > 0.5 ? 0.82 : 0.68);
  float sk = pow(vSky, 1.7) * uSkyK;
  vec3 light = vec3(sk * (0.55 + 0.6 * max(dot(vN, uSun), 0.0)) * (0.6 + 0.4 * face)) + uAmb * face;
  for (int i = 0; i < ${NL}; i++) {
    vec3 L = uLP[i].xyz - vW; float d = length(L); float at = clamp(1.0 - d / uLP[i].w, 0.0, 1.0);

  float d = distance(cameraPosition, vW);
  c = mix(c, uFogC, smoothstep(uFogN, uFogF, d));

}`;
const mk = (kind) => new THREE.ShaderMaterial({ uniforms: U, vertexShader: VS, fragmentShader: FS(kind), vertexColors: true, transparent: kind === 'water', depthWrite: kind !== 'water', side: kind === 'water' ? THREE.DoubleSide : THREE.FrontSide });
const MAT = { opaque: mk('opaque'), water: mk('water'), lava: mk('lava') };

// ---------- チャンク（Web Worker で作る） ----------
const NW = Math.max(1, Math.min(4, (navigator.hardwareConcurrency || 4) - 1));
const workers = Array.from({ length: NW }, () => new Worker(new URL('../js/worldgen.js', import.meta.url), { type: 'module' }));
const chunks = new Map(); // 'cx,cz' → { lod, group, blocks, lava, edits: Map }
const pending = new Map(); // 'cx,cz' → 依頼中の lod
let reqId = 0; const busy = new Array(NW).fill(0);
const queue = [];
const EDITS = new Map(); // 'cx,cz' → Map('x,y,z' → id)（掘った所）
function geoOf(m) {

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(m.pos, 3));
  g.setAttribute('normal', new THREE.BufferAttribute(m.nor, 3));
  g.setAttribute('color', new THREE.BufferAttribute(m.col, 3, true));
  g.setAttribute('sky', new THREE.BufferAttribute(m.sky, 1, true));
  g.setIndex(new THREE.BufferAttribute(m.idx, 1));

  return g;
}
workers.forEach((w, wi) => w.onmessage = (ev) => {
  busy[wi]--;
  const r = ev.data, k = r.cx + ',' + r.cz;
  if (pending.get(k) === r.lod) pending.delete(k);
  const old = chunks.get(k);
  const want = lodFor(r.cx, r.cz);
  if (want !== r.lod) { pump(); return; } // もう要らない・別の細かさを頼み直した
  const group = new THREE.Group(); group.position.set(r.cx * CH, 0, r.cz * CH);
  for (const kind of ['opaque', 'water', 'lava']) { const g = geoOf(r.mesh[kind]); if (g) { const m = new THREE.Mesh(g, MAT[kind]); m.renderOrder = kind === 'water' ? 2 : 0; group.add(m); } }
  scene.add(group);
  if (old) { scene.remove(old.group); old.group.traverse((o) => o.geometry && o.geometry.dispose()); }
  chunks.set(k, { lod: r.lod, group, blocks: r.blocks || (old && old.lod === 1 && r.lod !== 1 ? null : old && old.blocks) || null, lava: r.lava || [] });

});
function request(cx, cz, lod, front = false) {

  const ed = EDITS.get(k);
  const job = { cx, cz, lod, edits: ed ? [...ed].map(([kk, b]) => [...kk.split(',').map(Number), b]) : [] };
  pending.set(k, lod);
  if (front) queue.unshift(job); else queue.push(job);
  pump();
}
function pump() {

    while (busy[wi] < 2 && queue.length) {
      const j = queue.shift();
      busy[wi]++;
      workers[wi].postMessage({ id: ++reqId, seed: SEED, cx: j.cx, cz: j.cz, lod: j.lod, edits: j.edits });
    }
  }
}
let center = { cx: 1e9, cz: 1e9 };
const lodFor = (cx, cz) => { const d = Math.max(Math.abs(cx - center.cx), Math.abs(cz - center.cz)); return d <= RINGS[0] ? 1 : d <= RINGS[1] ? 2 : d <= RINGS[2] ? 4 : 0; };
function updateChunks(force = false) {

  if (!force && cx === center.cx && cz === center.cz) return;
  center = { cx, cz };
  for (const [k, c] of chunks) { const [x, z] = k.split(',').map(Number); if (lodFor(x, z) === 0) { scene.remove(c.group); c.group.traverse((o) => o.geometry && o.geometry.dispose()); chunks.delete(k); } }
  queue.length = 0; for (const [k, l] of pending) pending.delete(k);
  const R = RINGS[2], list = [];
  for (let dz = -R; dz <= R; dz++) for (let dx = -R; dx <= R; dx++) {
    const x = cx + dx, z = cz + dz, l = lodFor(x, z), c = chunks.get(x + ',' + z);
    if (!c || c.lod !== l) list.push([Math.hypot(dx, dz), x, z, l]);

const loadedNear = () => [...pending.keys()].length === 0 && queue.length === 0;

// ---------- 場所さがし（洞窟の入口・大空洞・鉱石の壁・地底湖） ----------
// 同じシードなら同じ場所になる。ページの中で、近くのチャンクを作って調べる（1 回だけ）
const GEN = createWorldGen(SEED);
const T0 = performance.now();
const blk = new Map(); // 'cx,cz' → blocks（調べる用）
const getBlocks = (cx, cz) => { const k = cx + ',' + cz; if (!blk.has(k)) blk.set(k, GEN.blocksOf(GEN.generate(cx, cz))); return blk.get(k); };
function blockAt(x, y, z) {
  if (y < 0) return B.BEDROCK; if (y >= HGT) return B.AIR;

  const ed = EDITS.get(k), lx = x - cx * CH, lz = z - cz * CH;

  const c = chunks.get(k); const b = c && c.blocks ? c.blocks : getBlocks(cx, cz);

const ORES = new Set([B.COAL, B.IRON, B.GOLD, B.DIAMOND]);
function findSites() {

  for (let cz = -R; cz <= R; cz++) for (let cx = -R; cx <= R; cx++) {
    const b = getBlocks(cx, cz);
    let lakeN = 0, lp = null;
    for (let z = 2; z < CH - 2; z += 2) for (let x = 2; x < CH - 2; x += 2) {
      const X = cx * CH + x, Z = cz * CH + z, top = GEN.heightAt(X, Z);
      for (let y = 12; y < Math.min(top - 10, 60); y += 2) {

        if (v === B.AIR && (!cavern || (y % 4 === 0))) {

    if (Math.max(Math.abs(cx), Math.abs(cz)) !== r) continue;
    const b = getBlocks(cx, cz);
    let n = 0, p = null;
    for (let i = 0; i < b.length; i++) { const y = Math.floor(i / (CH * CH)); if (y < 12 || y > 40) continue; if (b[i] === B.WATER && b[i + CH * CH] === B.AIR) { const x = i % CH, z = Math.floor(i / CH) % CH; if (GEN.heightAt(cx * CH + x, cz * CH + z) > y + 10) { n++; if (!p) p = [cx * CH + x, y, cz * CH + z]; } } }
    if (n > 12) lake = { n, p };

    } }

}
const SITE = findSites();

// ---------- 村人・たいまつ・落ちたアイテム ----------
const skinURL = (seed, body) => { const s = makeSkin(seed, body); const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d'), im = g.createImageData(64, 64); im.data.set(s.px); g.putImageData(im, 0, 0); return { url: c.toDataURL('image/png'), slim: s.slim }; };
const torchMat = { stick: new THREE.MeshLambertMaterial({ color: 0x7a5230 }), flame: new THREE.MeshBasicMaterial({ color: 0xffb040 }), core: new THREE.MeshBasicMaterial({ color: 0xfff0a0 }) };
function makeTorch() { const g = new THREE.Group(); const s = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.6, 0.12), torchMat.stick); s.position.y = 0.3; g.add(s); const f = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.22, 0.2), torchMat.flame); f.position.y = 0.68; g.add(f); const c = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.12, 0.1), torchMat.core); c.position.y = 0.78; g.add(c); g.userData.flame = f; return g; }
const lightSrc = []; // { pos: Vector3, col: [r,g,b], r, flick }
const miners = [], torches = [], drops = [];
const LOOKS = [['male', 5], ['female', 9], ['none', 14]];
SITE.spots.forEach((sp, i) => {
  const k = skinURL(LOOKS[i][1], LOOKS[i][0]);
  const ch = makeCharacter(k.url, { slim: k.slim, oneHand: true });
  ch.traverse((o) => { if (o.isMesh) patchXray(o.material); });
  const [x, y, z] = sp.stand;
  ch.position.set(x + 0.5, y, z + 0.5);
  ch.rotation.y = Math.atan2(sp.face[0], sp.face[1]);
  setTool(ch, i === 2 ? 'torch' : 'pick:iron');
  scene.add(ch);
  miners.push({ ch, sp, holdsTorch: i === 2, t0: i * 0.37, mined: 0, gone: false, back: 0 });
  // 壁に立てたたいまつ（掘る人の横の壁）
  // 壁に立てたたいまつ：掘る人の横の、壁の面（横から見た時にカメラと人の間に入らない）
  const tp = [x + 0.5 - sp.face[1] * 1.1 + sp.face[0] * 0.8, y + 1.2, z + 0.5 + sp.face[0] * 1.1 + sp.face[1] * 0.8];
  const t = makeTorch(); t.position.set(tp[0], tp[1] - 0.4, tp[2]); t.traverse((o) => { if (o.isMesh) patchXray(o.material); }); scene.add(t); torches.push(t);
  lightSrc.push({ pos: new THREE.Vector3(tp[0], tp[1] + 0.4, tp[2]), col: [1.0, 0.8, 0.55], r: 13, flick: i * 1.7 });
});
// 地底湖：天井の光るコケ（青白い光）と、岸のたいまつ
if (SITE.lake) {
  const [x, y, z] = SITE.lake;
  lightSrc.push({ pos: new THREE.Vector3(x + 0.5, y + 4, z + 0.5), col: [0.45, 0.75, 1.0], r: 18, flick: 0.3 });
  if (SITE.lakeCam) { const [a, b, c] = SITE.lakeCam; const t = makeTorch(); t.position.set(a, b - 1.4, c); t.traverse((o) => { if (o.isMesh) patchXray(o.material); }); scene.add(t); torches.push(t); lightSrc.push({ pos: new THREE.Vector3(a, b - 0.6, c), col: [1.0, 0.78, 0.5], r: 11, flick: 2.2 }); }
}
const itemMat = (ore) => { const c = COLORS[{ 8: 9, 9: 10, 10: 11, 11: 12 }[ore]]; return new THREE.MeshLambertMaterial({ color: new THREE.Color(c[0] / 255, c[1] / 255, c[2] / 255), emissive: ore === B.DIAMOND ? 0x0a4040 : 0x000000 }); };
function dropItem(p, ore) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), itemMat(ore)); patchXray(m.material);
  m.position.set(p[0] + 0.5, p[1] + 0.5, p[2] + 0.5); scene.add(m);
  drops.push({ m, t: 0, v: [(Math.random() - 0.5) * 1.5, 3.2, (Math.random() - 0.5) * 1.5], floor: p[1] - 0.35 });
}
// 鉱石を消す・戻す（そのチャンクだけ作り直す）
function setBlock(x, y, z, id) {
  const cx = Math.floor(x / CH), cz = Math.floor(z / CH), k = cx + ',' + cz;
  if (!EDITS.has(k)) EDITS.set(k, new Map());
  const lk = (x - cx * CH) + ',' + y + ',' + (z - cz * CH);
  if (id === null) EDITS.get(k).delete(lk); else EDITS.get(k).set(lk, id);
  if (lodFor(cx, cz) === 1) request(cx, cz, 1, true);
}

// ---------- 定点めぐり ----------
const S = SITE, C = S.cavern;
const ptsOf = () => {
  const pts = [];
  if (S.entrance) { const [x, y, z] = S.entrance; pts.push({ name: '洞窟の入口', pos: [x + 9, y + 7, z + 9], look: [x + 0.5, y - 2, z + 0.5], hold: 1.8 }); pts.push({ name: '洞窟の入口', pos: [x + 0.5, y - 3, z + 0.5], look: [C[0], C[1], C[2]], move: 3, hold: 0.3 }); }
  pts.push({ name: '大空洞', pos: [C[0] + 0.5, C[1] + 3, C[2] + 0.5], look: [C[0] + 8, C[1], C[2] + 4], move: 4, hold: 2 });
  if (S.spots.length) {
    // 掘る人を真横から見る：壁と平行な向きの、空いている側（たいまつのある側を先に試す）に立つ
    const [x, y, z] = S.spots[0].stand, f = S.spots[0].face;
    let best = null;
    for (const sg of [1, -1]) for (const d of [3.2, 2.6, 2.1]) {
      const px = x + 0.5 - f[1] * d * sg + f[0] * 0.15, pz = z + 0.5 + f[0] * d * sg + f[1] * 0.15;
      let free = 0; for (let k = 1; k <= 4; k++) { const t = k / 5; if (blockAt(Math.floor(x + 0.5 + (px - x - 0.5) * t), y + 1, Math.floor(z + 0.5 + (pz - z - 0.5) * t)) === B.AIR) free++; }
      if (blockAt(Math.floor(px), y + 1, Math.floor(pz)) === B.AIR) free += 2;
      const sc = free * 10 + d + (sg === 1 ? 1 : 0); if (!best || sc > best.sc) best = { sc, pos: [px, y + 1.35, pz] };
    }
    pts.push({ name: '鉱石の壁', pos: best.pos, look: [x + 0.5 + f[0] * 0.35, y + 1.05, z + 0.5 + f[1] * 0.35], move: 4, hold: 3 });
  }
  if (S.lake) { const [x, y, z] = S.lake; pts.push({ name: '地底湖', pos: S.lakeCam || [x + 6, y + 4, z + 6], look: [x + 0.5, y + 0.5, z + 0.5], move: 5, hold: 2.5 }); }
  return pts;
};
const TOUR = makeTour(ptsOf());
// 最初は定点めぐりが自動で始まる（?notour=1 で止める）。画面に触る・キーを押すと、そこから自由に動ける
let touring = Q.get('notour') !== '1', tourT = 0;

// ---------- 操作・ボタン ----------
const spec = makeSpectator(THREE, camera, renderer.domElement, { touch: TOUCH, ui: TOUCH ? document.getElementById('ui') : null, speed: 14 });
const goTop = () => { const h = GEN.heightAt(C[0], C[2]); camera.position.set(C[0] - 60, Math.max(h, 80) + 45, C[2] + 70); camera.lookAt(C[0], 64, C[2]); spec.sync(); };
const goCave = () => { camera.position.set(C[0] + 0.5, C[1] + 3, C[2] + 0.5); camera.lookAt(C[0] + 8, C[1], C[2] + 4); spec.sync(); };
const XNAME = ['なし', '近くを切る', '断面'];
const setX = (m) => { XRAY.uXMode.value = m; document.getElementById('bXray').textContent = '透かし：' + XNAME[m]; document.getElementById('bXray').classList.toggle('on', m > 0); };
document.getElementById('bXray').onclick = (e) => { e.stopPropagation(); setX((XRAY.uXMode.value + 1) % 3); };
document.getElementById('bTour').onclick = (e) => { e.stopPropagation(); touring = !touring; tourT = 0; spec.state.enabled = !touring; document.getElementById('bTour').classList.toggle('on', touring); if (!touring) spec.sync(); };
document.getElementById('bTop').onclick = (e) => { e.stopPropagation(); touring = false; spec.state.enabled = true; goTop(); };
document.getElementById('bCave').onclick = (e) => { e.stopPropagation(); touring = false; spec.state.enabled = true; goCave(); };
for (const b of document.querySelectorAll('.bar button')) b.addEventListener('pointerdown', (e) => e.stopPropagation());
const info = document.getElementById('info');
let infoTimer = 0;
const showInfo = (ms) => { info.classList.remove('hide'); clearTimeout(infoTimer); if (ms) infoTimer = setTimeout(() => info.classList.add('hide'), ms); };
document.getElementById('bHelp').onclick = (e) => { e.stopPropagation(); if (info.classList.contains('hide')) showInfo(TOUCH ? 6000 : 0); else info.classList.add('hide'); };
// めぐりの途中で触ったら、その場所から自由に動く
const stopTour = () => { if (!touring) return; touring = false; spec.state.enabled = true; spec.sync(); document.getElementById('bTour').classList.remove('on'); showInfo(TOUCH ? 6000 : 0); };
renderer.domElement.addEventListener('pointerdown', stopTour);
addEventListener('keydown', (e) => { if (!e.repeat) stopTour(); });
for (const el of document.querySelectorAll('#ui *')) el.addEventListener('pointerdown', stopTour);
if (touring) { spec.state.enabled = false; document.getElementById('bTour').classList.add('on'); info.classList.add('hide'); }
else showInfo(TOUCH ? 6000 : 0);
info.innerHTML = TOUCH
  ? '<b>左</b>のスティックで移動、<b>右</b>をドラッグで向き、<b>上・下</b>ボタンで上下。ブロックはすり抜けます。'
  : '画面をクリックするとマウスで向きを変えられます（Esc で戻る）。<b>WASD</b> 移動、<b>Space</b> 上、<b>Shift</b> 下、<b>Ctrl</b> 速く。ブロックはすり抜けます。';

// ---------- 毎フレーム ----------
goTop();
updateChunks(true);
const clock = new THREE.Clock();
let fpsN = 0, fpsT = 0; window.CAVES = { fps: 0, lite: LITE, site: SITE, tour: TOUR, camera, setX, chunks, ready: false, idle: () => loadedNear() };
const place = document.getElementById('place');
function frame() {
  const dt = Math.min(0.05, clock.getDelta()), time = clock.elapsedTime;
  U.uTime.value = time;
  if (touring) { tourT += dt; const s = applyTour(camera, TOUR, tourT % TOUR.duration); place.textContent = s.name; place.classList.add('show'); }
  else { place.classList.remove('show'); spec.update(dt); }
  updateChunks();
  // 地下にいるか：空と霧を暗くする
  const surf = GEN.heightAt(Math.floor(camera.position.x), Math.floor(camera.position.z));
  const under = Math.max(0, Math.min(1, (surf - 2 - camera.position.y) / 6));
  scene.background.copy(SKY_DAY).lerp(SKY_CAVE, under);
  U.uFogC.value.copy(scene.background);
  // 透かしの時は、地中を遠くまで見たいので霧を地上なみにする
  const fogU = XRAY.uXMode.value ? 0 : under;
  U.uFogN.value = VIEW * (0.55 - 0.45 * fogU); U.uFogF.value = VIEW * (0.98 - 0.72 * fogU);
  hemi.intensity = 1.0 * (1 - under * 0.7); sunL.intensity = 1.4 * (1 - under);
  // 洞窟の中は少しだけ青い明るさ（真っ暗にしない）。透かしの時は、切った中が見えるようにもっと明るく
  const xb = XRAY.uXMode.value ? 0.32 : 0;
  U.uAmb.value.set(0.08 + xb, 0.085 + xb, 0.105 + xb);
  // 透かしの中心（カメラの少し前）と、断面の高さ（カメラの 2 マス下より上を切る＝上から見下ろすと地中が見える）
  const fw = new THREE.Vector3(); camera.getWorldDirection(fw);
  XRAY.uXCenter.value = [camera.position.x + fw.x * 6, camera.position.y + fw.y * 6, camera.position.z + fw.z * 6];
  XRAY.uXR.value = 9;
  if (XRAY.uXMode.value === 2) XRAY.uXY.value = Math.min(camera.position.y - 2, SITE.cavern[1] + 6);
  // 村人：掘る（5 回たたくと鉱石が消えて、アイテムが落ちる。少しすると鉱石は戻る）
  for (const m of miners) {
    const tt = time + m.t0;
    if (m.holdsTorch) { animate(m.ch, 'idle', tt); continue; }
    animate(m.ch, m.gone ? 'idle' : 'dig', tt);
    const [ox, oy, oz, ore] = m.sp.ore;
    if (!m.gone && tt - m.mined > 5 / 1.3) { m.gone = true; m.back = tt + 5; setBlock(ox, oy, oz, B.AIR); dropItem([ox, oy, oz], ore); }
    if (m.gone && tt > m.back) { m.gone = false; m.mined = tt; setBlock(ox, oy, oz, null); }
  }
  for (const d of drops.slice()) {
    d.t += dt; const m = d.m;
    if (m.position.y > d.floor || d.v[1] > 0) { d.v[1] -= 9.8 * dt; m.position.x += d.v[0] * dt; m.position.y += d.v[1] * dt; m.position.z += d.v[2] * dt; if (m.position.y < d.floor) { m.position.y = d.floor; d.v = [0, 0, 0]; } }
    else m.position.y = d.floor + 0.08 + Math.sin(d.t * 3) * 0.06;
    m.rotation.y += dt * 2;
    if (d.t > 4) { scene.remove(m); m.geometry.dispose(); drops.splice(drops.indexOf(d), 1); }
  }
  // 光：たいまつ＋溶岩（カメラに近いものから NL 個）
  for (const t of torches) t.userData.flame.scale.y = 0.85 + 0.2 * Math.sin(time * 13 + t.position.x);
  const ls = lightSrc.slice();
  for (const m of miners) if (m.holdsTorch) { const p = new THREE.Vector3(); m.ch.userData.parts.hand.getWorldPosition(p); ls.push({ pos: p.add(new THREE.Vector3(0, 0.6, 0)), col: [1.0, 0.6, 0.28], r: 10, flick: 3 }); }
  for (const [k, c] of chunks) if (c.lava && c.lava.length) { const [cx, cz] = k.split(',').map(Number); for (const [x, y, z] of c.lava) ls.push({ pos: new THREE.Vector3(cx * CH + x + 0.5, y + 1.2, cz * CH + z + 0.5), col: [1.0, 0.42, 0.12], r: 9, flick: x + z }); }
  ls.sort((a, b) => a.pos.distanceToSquared(camera.position) - b.pos.distanceToSquared(camera.position));
  for (let i = 0; i < NL; i++) {
    const l = ls[i];
    if (!l) { U.uLP.value[i].set(0, -999, 0, 1); U.uLC.value[i].set(0, 0, 0); continue; }
    const f = 0.9 + 0.1 * Math.sin(time * 9 + l.flick);
    U.uLP.value[i].set(l.pos.x, l.pos.y, l.pos.z, l.r); U.uLC.value[i].set(l.col[0] * f * 1.5, l.col[1] * f * 1.5, l.col[2] * f * 1.5);
  }
  plights.forEach((p, i) => { const l = ls[i]; if (!l) { p.intensity = 0; return; } p.position.copy(l.pos); p.color.setRGB(l.col[0], l.col[1], l.col[2]); p.intensity = 2.2; p.distance = l.r; });
  renderer.render(scene, camera);
  fpsN++; fpsT += dt; if (fpsT > 1) { window.CAVES.fps = Math.round(fpsN / fpsT); fpsN = 0; fpsT = 0; }
  if (!window.CAVES.ready && loadedNear()) { window.CAVES.ready = true; document.getElementById('loading').remove(); }
  requestAnimationFrame(frame);
}
// 撮影・動画用：決めた見え方にする（far：地上の遠景、xray：透かしの洞窟、mine：掘るところ、lake：地底湖）
window.CAVES.view = (name) => {
  touring = false; spec.state.enabled = true; setX(0);
  const [x, y, z] = C;
  if (name === 'far') goTop();
  if (name === 'xray') { camera.position.set(x - 26, y + 34, z + 26); camera.lookAt(x, y, z); setX(2); }
  if (name === 'mine' && S.spots.length) { const p = TOUR.points.find((q) => q.name === '鉱石の壁'); camera.position.set(...p.pos); camera.lookAt(...p.look); }
  if (name === 'lake' && S.lake) { const p = TOUR.points.find((q) => q.name === '地底湖'); camera.position.set(...p.pos); camera.lookAt(...p.look); }
  spec.sync(); updateChunks(true);
};
requestAnimationFrame(frame);
</script>
