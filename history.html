<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>年表 | はじまり島</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e2a4f">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="はじまり島">
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));</script>
</head>
<body>
<!-- 年表（町の画面の「年表」のタブと同じ中身を、全画面で見るページ。前の「歴史」のページ。今までのリンクはここのまま） -->
<main class="wrap">
  <h1>年表</h1>
  <p class="muted">話ごとのまとまりです。押すと、その日のできごとが開きます。上のチップで種類をしぼれます。</p>
  <div id="chron"></div>
  <h2>島の建物（建った順）</h2>
  <div id="builds"></div>
</main>
<script type="module">
import { loadAll, nav, showError } from './js/common.js';
import { timelineHtml, setupChronicle, buildOrderHtml } from './js/islandpanel.js';
nav('history.html');
loadAll().then((D) => {
  const box = document.getElementById('chron');
  box.innerHTML = timelineHtml(D.config, D.history, D.villagers);
  setupChronicle(box);
  // 名前のチップを押すと、町の画面でその人の家へ
  box.addEventListener('click', (e) => { const b = e.target.closest('.vchip[data-key]'); if (b) { e.preventDefault(); location.href = './?v=' + encodeURIComponent(b.dataset.key); } });
  document.getElementById('builds').innerHTML = buildOrderHtml(D.world, D.config);
}).catch(showError);
</script>
</body>
</html>
