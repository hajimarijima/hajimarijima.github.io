# 毎日 1 回、インスタを読んで町を 1 日進め、data/ をコミットする（下書き）。
# 今は手で動かす時だけ（workflow_dispatch）。毎日動かすには schedule の行の # を外す。
# Secrets（Settings > Secrets and variables > Actions）に入れるもの：
#   IG_TOKEN / IG_USER_ID / IG_JOIN_MEDIA / IG_VOTE_MEDIA   （README 参照）
#   FIREBASE_SERVICE_ACCOUNT（Google ログインを使う時だけ。サービスアカウントの鍵の JSON をそのまま入れる）
#   TOWN_SALT（必須。名前・インスタ ID から作る印の秘密の塩。長いランダムな文字列。変えると村人の番号が全部変わる）
#   TOWN_HIDDEN（任意。あだ名で出す人のユーザー名をカンマ区切りで。hidden.json に書かずに済む）
name: daily

#
# 町を始める（0 日目 → 1 日目）：
#   ・data/config.json の "startAt" に始める日時を書く（例 "2026-11-28 06:00"、日本時間）。その時刻を過ぎた最初の朝の実行で 1 日目になる
#   ・または Actions → daily →「Run workflow」で start を選んで押す
#       「今すぐ」… その場で 1 日目になる
#       「次の朝6時」… startAt に次の朝 6 時を書くだけ。次の朝の実行で 1 日目になる
#   0 日目のあいだは、毎朝動いても日は進めない（「住みたい」の受付とその場の入居だけ）
on:
  workflow_dispatch:
    inputs:
      start:
        description: "町を始める（0 日目のとき）"
        type: choice
        options:
          - "始めない"
          - "次の朝6時"
          - "今すぐ"
        default: "始めない"
  schedule:
    - cron: "0 21 * * *"   # 毎朝 6 時（日本時間）

permissions:
  contents: write

concurrency:
  group: town
  cancel-in-progress: false

jobs:
  day:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: インスタを読む
        run: node tools/instagram.js
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_JOIN_MEDIA: ${{ secrets.IG_JOIN_MEDIA }}
          IG_VOTE_MEDIA: ${{ secrets.IG_VOTE_MEDIA }}
      - name: Google ログインのつなぎとプロフィールを読む
        # FIREBASE_SERVICE_ACCOUNT が空なら何もしないで終わる
        run: node tools/firestore_sync.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TOWN_SALT: ${{ secrets.TOWN_SALT }}
      - name: 住む人の受付（すぐ町に迎える）
        run: node tools/join.js
        env:
          TOWN_SALT: ${{ secrets.TOWN_SALT }}
          TOWN_HIDDEN: ${{ secrets.TOWN_HIDDEN }}
      - name: 遊び・手紙・家の飾りの記録を受け口から読む
        # DM_QUEUE_URL / DM_QUEUE_TOKEN が空なら何もしないで終わる（data/inbox/play.json は公開しない）
        run: node tools/play.js pull --days 3
        env:
          DM_QUEUE_URL: ${{ secrets.DM_QUEUE_URL }}
          DM_QUEUE_TOKEN: ${{ secrets.DM_QUEUE_TOKEN }}
      - name: 「次の朝6時」を選んだ時は、始める日時を書くだけ
        if: github.event_name == 'workflow_dispatch' && inputs.start == '次の朝6時'
        run: |
          node -e "
          const fs=require('fs'),p='data/config.json',c=JSON.parse(fs.readFileSync(p,'utf8'));
          const j=new Date(Date.now()+9*3600e3);              // 日本時間
          if(j.getUTCHours()>=6) j.setUTCDate(j.getUTCDate()+1); // 6 時を過ぎていたら次の日
          c.startAt=j.toISOString().slice(0,10)+' 06:00';
          fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');
          console.log('始める日時: '+c.startAt);"
      - name: 町を 1 日進める（0 日目のあいだは、始める時だけ）
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.start == '次の朝6時') }}
        run: node tools/sim.js --gate
        env:
          TOWN_SALT: ${{ secrets.TOWN_SALT }}
          TOWN_HIDDEN: ${{ secrets.TOWN_HIDDEN }}
          TOWN_START: ${{ github.event_name == 'workflow_dispatch' && inputs.start == '今すぐ' && 'true' || 'false' }}
          # 管理者用の村人を受け口に送る（tools/staff.js）
          DM_QUEUE_URL: ${{ secrets.DM_QUEUE_URL }}
          DM_QUEUE_TOKEN: ${{ secrets.DM_QUEUE_TOKEN }}
      - name: 結果をコミット
        # data/inbox/（生のコメント・名前が入る）は .gitignore で除外。ここで足すのは公開してよいファイルだけ
        run: |
          git config user.name "town-bot"
          git config user.email "town-bot@users.noreply.github.com"
          git add data/config.json data/villagers.json data/world.json data/state.json data/life.json data/history.json data/social.json data/diary data/requests.json data/requests_seen.json
          for f in data/mail.json data/decor.json data/visits.json data/workshop.json data/.k.json; do if [ -e "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet || git commit -m "町は $(node -p "require('./data/state.json').day") 日目"
          git push
