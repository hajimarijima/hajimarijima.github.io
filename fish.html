<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>釣りランキング | はじまり島</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e2a4f">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="はじまり島">
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));</script>
<style>
/* 釣りランキングだけで使う見た目 */
.frank { list-style: none; margin: 0; padding: 0; }
.frank li { display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto; align-items: baseline; gap: 6px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.frank li:last-child { border-bottom: 0; }
.frank li.empty { display: block; color: var(--sub); padding: 4px 0; }
.frank .no { font-weight: 700; color: var(--sub); text-align: right; }
.frank li.n1 .no { color: #c58b2b; }
.frank .who { min-width: 0; overflow-wrap: anywhere; }
.frank .who small { display: block; color: var(--sub); font-size: 12px; }
.frank .cm { font-weight: 700; font-size: 17px; white-space: nowrap; }
.frank .cm small { font-weight: 400; font-size: 12px; margin-left: 1px; }
.fgrid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.fgrid .card h3 { margin: 0 0 2px; font-size: 16px; }
.fgrid .card .range { margin: 0 0 6px; }
.big { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 999px; background: #fff0c2; color: #7a5a12; margin-left: 4px; vertical-align: 1px; }
</style>
</head>
<body>
<main class="wrap">
  <h1>釣りランキング</h1>
  <p class="muted" id="lead">釣った魚は大きさがいろいろ。大きいほどめったに釣れず、ときどき「大物」がかかります。</p>
  <div id="empty"></div>
  <h2>島でいちばん大きな魚</h2>
  <div class="card"><ol class="frank" id="overall"></ol></div>
  <h2>魚ごとの記録</h2>
  <div class="fgrid" id="species"></div>
</main>
<script type="module">
import { loadAll, nav, esc, villagerUrl, showError, emptyNote } from './js/common.js';
nav('fish.html');
loadAll().then((D) => {
  const FC = D.config.fishing || {}, sizes = FC.sizes || {};
  const F = D.state.fishing || {}, top = F.top || {};
  const byKey = new Map(D.villagers.map((v) => [v.key, v]));
  const nameOf = (it) => (D.config.items[it] || {}).name || it;
  // 名前は villagers.json の表示名（かくしている人はあだ名）
  const who = (k) => { const v = byKey.get(k); return v ? `<a href="${villagerUrl(v)}">${esc(v.display)}</a>` : '<span class="muted">（もういない村人）</span>'; };
  const big = (it, cm) => (sizes[it] && cm > sizes[it].max ? '<span class="big">大物</span>' : '');
  const row = (i, it, [cm, k, day], showFish) => `<li class="n${i + 1}"><span class="no">${i + 1}</span>` +
    `<span class="who">${showFish ? esc(nameOf(it)) + big(it, cm) + ' ・ ' : ''}${who(k)}<small>${day}日目に釣った${showFish ? '' : big(it, cm)}</small></span>` +
    `<span class="cm">${cm}<small>cm</small></span></li>`;
  if (!D.active.length) document.getElementById('empty').innerHTML = emptyNote(D.config);
  if (F.catches) document.getElementById('lead').textContent += `（これまでに ${F.catches} 匹）`;
  // 島ぜんぶの大きい順（魚ごとの上位から集める）
  const all = [];
  for (const [it, list] of Object.entries(top)) for (const r of list) all.push([it, r]);
  all.sort((a, b) => b[1][0] - a[1][0] || a[1][2] - b[1][2]);
  document.getElementById('overall').innerHTML = all.slice(0, 10).map(([it, r], i) => row(i, it, r, true)).join('') || '<li class="empty">まだだれも魚を釣っていません。</li>';
  // 魚ごと（釣れる魚は config.json の fishing.fish と、夜だけの魚）
  const kinds = Object.keys(sizes);
  const ks = (l) => new Set((l || []).map(([k]) => k));
  const day = ks(FC.fish), sea = ks(FC.seaFish), seaN = ks(FC.seaNightFish), pondN = ks((D.config.hours || {}).nightFish);
  const tagOf = (it) => { // 釣れる所：池・海べ。昼に出ず夜だけの魚は「夜だけ」
    const pl = [(day.has(it) || pondN.has(it)) && '池', (sea.has(it) || seaN.has(it)) && '海べ'].filter(Boolean).join('・');
    return `${pl}${!day.has(it) && !sea.has(it) ? '・夜だけ' : ''}`;
  };
  document.getElementById('species').innerHTML = kinds.map((it) => {
    const s = sizes[it], list = top[it] || [], tg = tagOf(it);
    return `<div class="card"><h3><img src="icons/${esc(it)}.png" alt="" width="24" height="24" style="image-rendering:pixelated;vertical-align:-5px"> ${esc(nameOf(it))}${tg ? ` <small class="muted">${tg}</small>` : ''}</h3>` +
      `<p class="muted range">ふつう ${s.min}〜${s.max}cm・大物は ${s.bigMax || s.max}cm まで</p>` +
      `<ol class="frank">${list.map((r, i) => row(i, it, r, false)).join('') || '<li class="empty">まだ釣れていません。</li>'}</ol></div>`;
  }).join('');
}).catch(showError);
</script>
</body>
</html>
