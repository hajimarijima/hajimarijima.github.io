<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>村人 | はじまり島</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e2a4f">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="はじまり島">
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));</script>
</head>
<body>
<main class="wrap" id="main">
  <p class="muted"><a href="people.html">村人の一覧</a></p>
  <div class="grid2">
    <div class="viewer" id="viewer"></div>
    <div>
      <h1 id="name" style="overflow-wrap:anywhere"></h1>
      <dl class="info" id="info"></dl>
      <h2>これまでに集めた資源</h2>
      <div class="stats" id="stats"></div>
    </div>
  </div>
  <h2>持ち物</h2>
  <div class="card">
    <div class="lvrow"><b class="lv" id="lv"></b><div class="xpbar"><i id="xpbar"></i></div><span class="muted" id="slotsnum"></span></div>
    <p class="muted" id="nextslot" style="margin:6px 0 10px"></p>
    <div class="inv" id="inv"></div>
    <p class="muted" id="invinfo" style="margin:8px 0 0;min-height:1.6em"></p>
  </div>
  <h2>関係</h2>
  <div class="card"><ul class="rels" id="rels"></ul><p class="muted" style="margin:8px 0 0"><a href="relations.html" id="relmap">町の相関図を見る</a></p></div>
  <h2>最近の立ち話</h2>
  <div class="card"><ul class="talks" id="talks"></ul></div>
  <!-- プロフィール（今は出さない。config.json の ui.profileSection を true にすると出る） -->
  <section id="profsec" hidden>
  <h2>プロフィール</h2>
  <div class="card">
    <dl class="info" id="profview"></dl>
    <div class="authbox" id="authbox"></div>
    <form class="profedit" id="profedit" hidden></form>
    <details class="fallback" id="fallback">
      <summary>コメントで送る（予備の方法：MBTI と誕生日だけ）</summary>
      <p class="muted" style="margin:8px 0 10px">下で選ぶと短い文ができます。それを<b>インスタの登録投稿にコメント</b>すると、毎日の更新で、コメントした人のアカウントと照らし合わせて反映します。年は聞きません。</p>
      <div class="profform">
        <label>MBTI<select id="pmbti"></select></label>
        <label>誕生月<select id="pmonth"></select></label>
        <label>日<select id="pday"></select></label>
      </div>
      <div class="profout"><code id="ptext"></code><button type="button" id="pcopy">コピー</button><a id="pform" class="btn" target="_blank" rel="noopener" hidden>フォームで送る</a></div>
      <p class="muted" id="pmsg" style="margin:6px 0 0;min-height:1.4em"></p>
    </details>
  </div>
  </section>
  <h2>建てるのに関わった建物</h2>
  <p id="built"></p>
  <section id="fishsec" hidden>
  <h2>釣った一番大きな魚</h2>
  <p id="fishbest"></p>
  <p class="muted" style="margin:4px 0 0"><a href="fish.html">釣りランキングを見る</a></p>
  </section>
  <h2>日記</h2>
  <div class="card"><ul class="list diary" id="diary"></ul></div>
</main>
<script src="js/profile-fields.js"></script>
<script type="module" src="js/villager.js"></script>
</body>
</html>
