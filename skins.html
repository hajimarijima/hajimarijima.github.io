<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>スキン一覧 | みんなで町づくり</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7cb342">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="町づくり">
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));</script>
</head>
<body>
<main class="wrap">
  <h1>スキン一覧</h1>
  <p class="muted">村人の見た目は、ここにある 200 枚のどれかです。名前から決まるので、同じ人はいつも同じスキンになります。すべてスクリプトで組み合わせて作ったものです。</p>
  <div class="filter" id="filter"><button data-f="all" class="on">すべて</button><button data-f="used">村人が使っている</button></div>
  <div class="skins" id="grid"></div>
</main>
<div class="modal" id="modal" hidden>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center"><b id="mt"></b><button class="btn sub" id="mclose">閉じる</button></div>
    <div class="views" style="margin:12px 0">
      <figure><canvas id="mf" class="pixel" width="64" height="128" style="width:96px;height:192px"></canvas><figcaption>前</figcaption></figure>
      <figure><canvas id="mb" class="pixel" width="64" height="128" style="width:96px;height:192px"></canvas><figcaption>うしろ</figcaption></figure>
      <figure><img id="mraw" class="pixel" width="128" height="128" alt="スキンの元の画像" style="background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/16px 16px"><figcaption>元の画像（64×64）</figcaption></figure>
    </div>
    <ul class="list" id="mtraits"></ul>
    <p id="musers" class="muted"></p>
  </div>
</div>
<script type="module">
import { load, nav, esc, skinUrl, loadImage, drawFigure, villagerUrl, showError } from './js/common.js';
nav('skins.html');
Promise.all([fetch('skins/index.json').then((r) => r.json()), load('villagers'), load('state')]).then(([skins, villagers, state]) => {
  const users = {};
  for (const v of villagers.filter((x) => x.joinedDay <= state.day)) (users[v.skin] = users[v.skin] || []).push(v);
  const grid = document.getElementById('grid');
  const cards = skins.map((s) => {
    const b = document.createElement('button');
    b.className = 'skin' + (users[s.id] ? ' used' : '');
    b.id = 's' + s.id;
    const c = document.createElement('canvas');
    c.width = 16; c.height = 32; c.className = 'pixel';
    loadImage(skinUrl(s.id)).then((img) => drawFigure(c.getContext('2d'), img));
    const sm = document.createElement('small');
    sm.textContent = s.id + (users[s.id] ? '・' + users[s.id].length + '人' : '');
    b.append(c, sm);
    b.onclick = () => open(s);
    grid.append(b);
    return b;
  });
  document.getElementById('filter').addEventListener('click', (e) => {
    const f = e.target.dataset && e.target.dataset.f; if (!f) return;
    for (const x of e.currentTarget.children) x.classList.toggle('on', x.dataset.f === f);
    cards.forEach((c, i) => { c.hidden = f === 'used' && !users[i]; });
  });
  const modal = document.getElementById('modal');
  async function open(s) {
    const img = await loadImage(skinUrl(s.id));
    document.getElementById('mt').textContent = 'スキン ' + s.id + ' 番';
    for (const [id, back] of [['mf', false], ['mb', true]]) { const ctx = document.getElementById(id).getContext('2d'); ctx.clearRect(0, 0, 64, 128); drawFigure(ctx, img, back, 4); }
    document.getElementById('mraw').src = skinUrl(s.id);
    document.getElementById('mtraits').innerHTML = s.traits.map((t) => `<li>${esc(t)}</li>`).join('');
    const u = users[s.id] || [];
    document.getElementById('musers').innerHTML = u.length ? '使っている村人：' + u.map((v) => `<a href="${villagerUrl(v)}">${esc(v.display)}</a>`).join('、') : 'まだだれも使っていません。';
    modal.hidden = false;
  }
  document.getElementById('mclose').onclick = () => { modal.hidden = true; };
  modal.addEventListener('click', (e) => { if (e.target === modal) modal.hidden = true; });
  if (location.hash) { const s = skins[+location.hash.slice(2)]; if (s) { document.getElementById('s' + s.id).scrollIntoView({ block: 'center' }); open(s); } }
}).catch(showError);
</script>
</body>
</html>
