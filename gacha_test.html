<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ガチャ（ためし）</title>
<style>
  :root { --bg: #f6f1e4; --card: #fffdf6; --ink: #2f2c26; --sub: #7a7466; --red: #b8312f; --line: #e4dccb;
    --N: #9aa3a8; --R: #3f8fd6; --SR: #a35bd6; --SSR: #f0a020; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "BIZ UDPGothic", "Yu Gothic", "Meiryo", sans-serif; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 6px 0 4px; white-space: nowrap; }
  .note { font-size: 13px; color: var(--sub); margin: 0 0 12px; }
  .row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .row::-webkit-scrollbar { display: none; }
  .row button { flex: none; padding: 8px 12px; border-radius: 999px; border: 2px solid var(--line); background: var(--card); font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap; color: var(--ink); }
  .row button.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .lbl { font-size: 12px; color: var(--sub); margin: 12px 0 4px; font-weight: 700; }
  .wallet { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 14px; padding: 10px 14px; box-shadow: 0 2px 8px rgba(0,0,0,.08); margin-top: 12px; }
  .coin { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff2b8, #e8b030 55%, #a86a10); box-shadow: inset 0 -2px 0 rgba(0,0,0,.2); flex: none; }
  .wallet b { font-size: 22px; }
  .wallet .add { margin-left: auto; font-size: 12px; padding: 6px 10px; border: 1px dashed var(--sub); background: none; border-radius: 8px; color: var(--sub); cursor: pointer; white-space: nowrap; }
  .kinds { display: flex; gap: 8px; margin: 12px 0 10px; }
  .kinds button { flex: 1; padding: 10px 6px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); font: inherit; font-weight: 800; font-size: 15px; cursor: pointer; white-space: nowrap; color: var(--ink); }
  .kinds button.on { border-color: var(--red); color: var(--red); }
  .machine { position: relative; border-radius: 22px; overflow: hidden; box-shadow: 0 6px 18px rgba(0,0,0,.14); }
  .scene { position: relative; height: 300px; overflow: hidden; }
  .panel { background: var(--card); padding: 12px 14px 14px; }
  .price { font-size: 12px; color: var(--sub); margin: 0 0 8px; text-align: center; white-space: nowrap; }
  .btns { display: flex; gap: 8px; }
  .btns button { flex: 1; padding: 14px 4px; border: none; border-radius: 14px; font: inherit; font-weight: 800; font-size: 15px; color: #fff; cursor: pointer; white-space: nowrap; box-shadow: 0 4px 0 rgba(0,0,0,.18); }
  .btns button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
  .free { background: #2f7a4a; } .one { background: var(--red); } .ten { background: #7a3fa8; }
  .btns button:disabled { background: #c9c2b2; cursor: default; box-shadow: none; }
  .rates, .bag { margin-top: 14px; background: var(--card); border-radius: 14px; padding: 10px 14px; font-size: 13px; }
  .rates summary { cursor: pointer; font-weight: 700; }
  .rates table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  .rates td { padding: 4px 2px; border-top: 1px solid var(--line); vertical-align: top; }
  .tag { display: inline-block; min-width: 40px; text-align: center; padding: 1px 6px; border-radius: 6px; color: #fff; font-weight: 800; font-size: 12px; }
  .bag h2 { font-size: 15px; margin: 0 0 6px; }
  .bag ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
  .bag li { display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
  .ico { width: 32px; height: 32px; image-rendering: pixelated; flex: none; }
  .ph { display: inline-grid; place-items: center; }
  .ico.ph { font-size: 22px; }

  /* ===== 演出（全画面） ===== */
  .over { position: fixed; inset: 0; z-index: 10; display: none; overflow: hidden; }
  .over.on { display: block; }
  .over .scene { position: absolute; inset: 0; height: auto; }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .flash.go { animation: flash .6s ease-out; }
  @keyframes flash { 0% { opacity: 0; } 15% { opacity: .95; } 100% { opacity: 0; } }
  .reveal { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 16px; background: radial-gradient(circle at 50% 42%, rgba(20,24,34,.55), rgba(8,10,16,.92)); }
  .reveal.on { display: flex; }
  .rays { position: absolute; left: 50%; top: 42%; width: 900px; height: 900px; margin: -450px 0 0 -450px; background: repeating-conic-gradient(from 0deg, var(--c) 0 8deg, transparent 8deg 22deg); opacity: .22; animation: spin 14s linear infinite; border-radius: 50%; -webkit-mask: radial-gradient(circle, #000 20%, transparent 65%); mask: radial-gradient(circle, #000 20%, transparent 65%); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .one-prize { position: relative; text-align: center; color: #fff; animation: pop .55s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes pop { from { transform: scale(.2); opacity: 0; } to { transform: none; opacity: 1; } }
  .one-prize .rk { font-size: 20px; font-weight: 900; letter-spacing: .12em; color: var(--c); text-shadow: 0 0 12px var(--c); white-space: nowrap; }
  .one-prize .halo { width: 200px; height: 200px; margin: 6px auto 10px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle, color-mix(in srgb, var(--c) 70%, transparent), transparent 70%); }
  .one-prize .halo img { width: 120px; height: 120px; image-rendering: pixelated; filter: drop-shadow(0 6px 10px rgba(0,0,0,.4)); animation: bob 2s ease-in-out infinite; }
  .one-prize .halo .ph { font-size: 84px; animation: bob 2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-8px); } }
  .one-prize .nm { font-size: 28px; font-weight: 900; white-space: nowrap; }
  .grid10 { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: min(480px, 100%); perspective: 600px; }
  .card { position: relative; height: 96px; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.3,1.3,.5,1); }
  .card.flip { transform: rotateY(180deg); }
  .card > div { position: absolute; inset: 0; border-radius: 12px; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .card .back { background: linear-gradient(145deg, #3a4256, #1e2330); border: 2px solid rgba(255,255,255,.25); color: rgba(255,255,255,.6); font-size: 26px; }
  .card .front { transform: rotateY(180deg); background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 2px var(--c), 0 0 14px color-mix(in srgb, var(--c) 60%, transparent); color: #fff; font-size: 11px; padding: 2px; }
  .card img, .card .front .ph { width: 44px; height: 44px; image-rendering: pixelated; font-size: 30px; }
  .card span { display: block; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card b { color: var(--c); font-size: 11px; }
  .close { position: relative; margin-top: 22px; padding: 12px 34px; border: none; border-radius: 12px; background: #fff; font: inherit; font-weight: 800; font-size: 16px; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .3s; }
  .close.on { opacity: 1; pointer-events: auto; }
  .skip { position: absolute; right: 14px; bottom: 18px; padding: 8px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.5); background: rgba(0,0,0,.25); color: #fff; font: inherit; font-size: 13px; cursor: pointer; }

  /* ===== 1. カプセル ===== */
  .t-capsule { background: radial-gradient(circle at 50% 30%, #ffe9d6, #f3b8a0 70%, #d98a74); }
  .t-capsule .lights { position: absolute; top: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 14px; }
  .t-capsule .lights i { width: 10px; height: 10px; border-radius: 50%; background: #fff6c0; box-shadow: 0 0 8px #ffd860; animation: blink 1s infinite alternate; }
  .t-capsule .lights i:nth-child(2n) { animation-delay: .5s; }
  @keyframes blink { to { opacity: .25; } }
  .cap-mc { position: absolute; left: 50%; bottom: 0; width: 230px; margin-left: -115px; }
  .cap-dome { position: relative; width: 210px; height: 170px; margin: 0 auto; border-radius: 105px 105px 20px 20px; background: linear-gradient(160deg, rgba(255,255,255,.95), rgba(200,230,255,.5) 60%, rgba(255,255,255,.8)); border: 7px solid #f4f0e6; box-shadow: inset 0 -10px 20px rgba(0,0,0,.08), 0 4px 0 #cfc6b0; overflow: hidden; }
  .cap-dome::after { content: ""; position: absolute; left: 22px; top: 18px; width: 30px; height: 70px; border-radius: 20px; background: rgba(255,255,255,.7); transform: rotate(18deg); }
  .cap-dome i { position: absolute; width: 42px; height: 42px; border-radius: 50%; overflow: hidden; box-shadow: inset -4px -6px 0 rgba(0,0,0,.15); }
  .cap-dome i::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 50%; background: rgba(255,255,255,.92); }
  .cap-body { position: relative; height: 110px; margin-top: -4px; background: linear-gradient(#d83c36, #a8251f); border-radius: 12px 12px 6px 6px; box-shadow: inset 0 4px 0 rgba(255,255,255,.25); }
  .cap-body .knob { position: absolute; left: 34px; top: 22px; width: 62px; height: 62px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff, #e8dcc0); border: 5px solid #7a2a1c; }
  .cap-body .knob::before { content: ""; position: absolute; left: 50%; top: 5px; bottom: 5px; width: 12px; margin-left: -6px; background: #7a2a1c; border-radius: 6px; }
  .cap-body .out { position: absolute; right: 26px; top: 30px; width: 70px; height: 54px; background: #3a120c; border-radius: 10px 10px 30px 30px; box-shadow: inset 0 6px 10px rgba(0,0,0,.6); }
  .cap-body .plate { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; color: #ffe9b0; font-weight: 900; font-size: 13px; letter-spacing: .2em; }
  .over .t-capsule .cap-mc { transform: scale(1.5); transform-origin: 50% 100%; bottom: 18%; }
  .over .t-capsule .knob { animation: knob 1s cubic-bezier(.5,0,.3,1) .2s both; }
  @keyframes knob { to { transform: rotate(540deg); } }
  .over .t-capsule .cap-dome i { animation: jiggle .25s 4 alternate .2s; }
  @keyframes jiggle { to { transform: translate(3px, -6px) rotate(20deg); } }
  .ball { position: absolute; width: 110px; height: 110px; border-radius: 50%; overflow: hidden; background: var(--c); box-shadow: inset -10px -14px 0 rgba(0,0,0,.15), 0 10px 20px rgba(0,0,0,.3); }
  .ball::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 50%; background: #fff; box-shadow: inset 0 3px 0 rgba(0,0,0,.12); }
  .ball::before { content: ""; position: absolute; left: 18px; top: 14px; width: 26px; height: 16px; border-radius: 50%; background: rgba(255,255,255,.6); z-index: 1; }
  .over .t-capsule .ball { left: 50%; top: 58%; margin: -55px 0 0 -55px; animation: roll 1.1s cubic-bezier(.3,1.4,.5,1) 1.2s both, wob .18s 2.4s 5 alternate; }
  @keyframes roll { from { transform: translate(60px, 90px) scale(.3) rotate(-300deg); opacity: 0; } 30% { opacity: 1; } to { transform: none; } }
  @keyframes wob { from { transform: rotate(-12deg); } to { transform: rotate(12deg); } }

  /* ===== 2. ガラガラ（福引き） ===== */
  .t-gara { background: linear-gradient(#fff4dc, #ffd9a0); }
  .t-gara .curtain { position: absolute; left: 0; right: 0; top: 0; height: 44px; background: repeating-linear-gradient(90deg, #d8302a 0 40px, #fff 40px 80px); border-bottom-left-radius: 50% 18px; border-bottom-right-radius: 50% 18px; box-shadow: 0 4px 0 rgba(0,0,0,.08); }
  .t-gara .sign { position: absolute; top: 56px; left: 50%; transform: translateX(-50%); background: #b8312f; color: #fff; font-weight: 900; padding: 6px 18px; border-radius: 8px; white-space: nowrap; font-size: 15px; letter-spacing: .1em; box-shadow: 0 3px 0 #7a1c18; }
  .gara { position: absolute; left: 50%; bottom: 26px; width: 220px; height: 190px; margin-left: -110px; }
  .gara .drum { position: absolute; left: 30px; top: 0; width: 160px; height: 160px; }
  .gara .stand { position: absolute; left: 10px; right: 10px; bottom: 0; height: 40px; background: linear-gradient(#a8743c, #7a5226); border-radius: 8px; }
  .gara .tray { position: absolute; right: -6px; bottom: 6px; width: 70px; height: 26px; background: #c9a060; border-radius: 0 0 30px 30px; border: 3px solid #7a5226; border-top: none; }
  .gara .arm { position: absolute; left: 106px; top: 76px; width: 8px; height: 8px; }
  .over .t-gara .gara { transform: scale(1.5); transform-origin: 50% 100%; bottom: 20%; }
  .over .t-gara .drum svg { animation: spin2 1.5s cubic-bezier(.4,0,.4,1) .2s both; transform-origin: 80px 80px; }
  @keyframes spin2 { to { transform: rotate(720deg); } }
  .gball { position: absolute; width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, var(--c) 45%, color-mix(in srgb, var(--c) 70%, #000)); box-shadow: 0 0 12px var(--c); }
  .over .t-gara .gball { left: 140px; top: 100px; animation: shoot .9s cubic-bezier(.3,0,.6,1) 1.65s both; }
  @keyframes shoot { 0% { transform: translate(0,0); opacity: 0; } 10% { opacity: 1; } 55% { transform: translate(40px, 40px); } 75% { transform: translate(58px, 70px); } 88% { transform: translate(62px, 62px); } 100% { transform: translate(66px, 72px); } }
  .bell { position: absolute; left: 50%; top: 24%; transform: translateX(-50%); font-size: 30px; font-weight: 900; color: #b8312f; white-space: nowrap; opacity: 0; text-shadow: 0 2px 0 #fff; }
  .over .t-gara .bell { animation: bell .9s ease-out 2.4s both; }
  @keyframes bell { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.6); } 40% { opacity: 1; transform: translate(-50%, 0) scale(1.15) rotate(-4deg); } 100% { opacity: 1; transform: translate(-50%, 0) scale(1) rotate(3deg); } }

  /* ===== 3. 島のおみくじ ===== */
  .t-omi { background: linear-gradient(#fbe8ec, #f6d0d8 60%, #e8b8a8); }
  .t-omi .torii { position: absolute; left: 50%; top: 20px; width: 260px; margin-left: -130px; height: 230px; }
  .t-omi .torii::before { content: ""; position: absolute; left: -10px; right: -10px; top: 0; height: 18px; background: #d8352c; border-radius: 10px 10px 4px 4px; box-shadow: 0 4px 0 #222; }
  .t-omi .torii::after { content: ""; position: absolute; left: 30px; right: 30px; top: 0; bottom: 0; border-left: 16px solid #d8352c; border-right: 16px solid #d8352c; top: 22px; }
  .t-omi .beam { position: absolute; left: 14px; right: 14px; top: 44px; height: 12px; background: #d8352c; }
  .t-omi .petal { position: absolute; width: 10px; height: 8px; background: #ffc0cf; border-radius: 10px 0; animation: fall 6s linear infinite; }
  @keyframes fall { from { transform: translate(0, -20px) rotate(0); } to { transform: translate(-60px, 340px) rotate(540deg); } }
  .omi { position: absolute; left: 50%; bottom: 30px; width: 90px; height: 150px; margin-left: -45px; }
  .omi .box { position: absolute; inset: 0; background: linear-gradient(90deg, #8a5a2a, #b07a40 40%, #8a5a2a); border-radius: 10px; border: 4px solid #5a3818; box-shadow: 0 6px 0 rgba(0,0,0,.2); }
  .omi .box::after { content: "島みくじ"; position: absolute; left: 50%; top: 20px; transform: translateX(-50%); writing-mode: vertical-rl; color: #fff3d6; font-weight: 900; font-size: 18px; letter-spacing: .15em; background: #b8312f; padding: 8px 3px; border-radius: 4px; }
  .omi .stick { position: absolute; left: 50%; top: 0; width: 12px; height: 100px; margin-left: -6px; background: linear-gradient(#f8e8c0, #e8cc90); border-radius: 3px; opacity: 0; }
  .omi .stick::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 22px; background: var(--c); border-radius: 3px 3px 0 0; }
  .over .t-omi .omi { transform: scale(1.6); transform-origin: 50% 100%; bottom: 34%; animation: shakebox .2s 6 alternate .2s, flipbox .6s ease-in-out 1.4s forwards; }
  @keyframes shakebox { from { transform: scale(1.6) rotate(-10deg) translateY(0); } to { transform: scale(1.6) rotate(10deg) translateY(-10px); } }
  @keyframes flipbox { to { transform: scale(1.6) rotate(170deg) translateY(20px); } }
  .over .t-omi .stick { animation: stickout .5s ease-out 2s forwards; }
  @keyframes stickout { from { opacity: 1; transform: translateY(0); } to { opacity: 1; transform: translateY(-80px); } }
  .scroll { position: absolute; left: 50%; top: 18%; width: 110px; margin-left: -55px; height: 0; background: #fffaf0; border: 3px solid #c8a060; border-left-width: 8px; border-right-width: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; writing-mode: vertical-rl; font-weight: 900; font-size: 28px; color: var(--c); letter-spacing: .2em; opacity: 0; box-shadow: 0 8px 18px rgba(0,0,0,.25); }
  .over .t-omi .scroll { animation: unroll .7s ease-out 2.5s forwards; }
  @keyframes unroll { from { opacity: 1; height: 0; } to { opacity: 1; height: 240px; } }

  /* ===== 4. 海の釣り ===== */
  .t-fish { background: linear-gradient(#8fd3ff 0 38%, #3a9ad8 38%, #1e6aa8); }
  .t-fish .sun { position: absolute; right: 36px; top: 22px; width: 50px; height: 50px; border-radius: 50%; background: #fff6b0; box-shadow: 0 0 30px #fff2a0; }
  .t-fish .wave { position: absolute; left: -20%; right: -20%; height: 30px; background: radial-gradient(circle at 20px -6px, transparent 20px, rgba(255,255,255,.35) 21px 24px, transparent 25px) 0 0 / 40px 30px repeat-x; animation: wave 3s linear infinite; }
  @keyframes wave { to { transform: translateX(40px); } }
  .t-fish .line { position: absolute; left: 50%; top: -10px; width: 2px; height: 140px; background: rgba(255,255,255,.9); transform-origin: top; }
  .t-fish .bob { position: absolute; left: 50%; top: 124px; width: 22px; height: 30px; margin-left: -10px; border-radius: 50% 50% 45% 45%; background: linear-gradient(#e83a30 0 50%, #fff 50%); box-shadow: 0 2px 4px rgba(0,0,0,.3); animation: float 1.6s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(5px); } }
  .t-fish .boat { position: absolute; left: 14px; top: calc(38% - 16px); width: 70px; height: 20px; background: #8a5a2a; border-radius: 0 0 30px 30px; }
  .over .t-fish .bob { top: 45%; animation: float .5s ease-in-out 3, dip .3s ease-in 1.5s forwards; }
  @keyframes dip { to { transform: translateY(26px); opacity: .4; } }
  .over .t-fish .line { height: 45%; animation: pull .5s ease-in 2.2s forwards; }
  @keyframes pull { to { transform: scaleY(.25); } }
  .bang { position: absolute; left: 50%; top: 32%; margin-left: 20px; font-size: 54px; font-weight: 900; color: #ffe060; text-shadow: 0 3px 0 #b8312f; opacity: 0; }
  .over .t-fish .bang { animation: bang .5s ease-out 1.5s both; }
  @keyframes bang { 0% { opacity: 0; transform: scale(.3); } 60% { opacity: 1; transform: scale(1.3); } 100% { opacity: 1; transform: scale(1); } }
  .splash { position: absolute; left: 50%; top: 48%; width: 0; height: 0; }
  .splash i { position: absolute; width: 10px; height: 14px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: rgba(255,255,255,.9); opacity: 0; }
  .over .t-fish .splash i { animation: drop .7s ease-out 2.2s both; }
  @keyframes drop { 0% { opacity: 1; transform: translate(0, 0); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)); } }
  .orb { position: absolute; left: 50%; top: 48%; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, var(--c) 50%, transparent 72%); box-shadow: 0 0 40px var(--c); opacity: 0; }
  .over .t-fish .orb { animation: rise .7s cubic-bezier(.3,1.4,.5,1) 2.25s both; }
  @keyframes rise { from { opacity: 0; transform: translateY(60px) scale(.4); } to { opacity: 1; transform: translateY(-110px) scale(1.2); } }

  /* ===== 5. たまご ===== */
  .t-egg { background: radial-gradient(circle at 50% 70%, #fff8e0, #f3e2b0 60%, #d9c088); }
  .t-egg .grass { position: absolute; left: 0; right: 0; bottom: 0; height: 60px; background: linear-gradient(#8cc860, #5c9a3c); }
  .t-egg .grass::before { content: ""; position: absolute; left: 0; right: 0; top: -12px; height: 14px; background: radial-gradient(circle at 8px 14px, #8cc860 8px, transparent 9px) 0 0 / 16px 14px repeat-x; }
  .nest { position: absolute; left: 50%; bottom: 40px; width: 200px; height: 50px; margin-left: -100px; background: repeating-linear-gradient(20deg, #a8743c 0 6px, #8a5a2a 6px 12px); border-radius: 0 0 100px 100px; }
  .egg { position: absolute; left: 50%; bottom: 60px; width: 130px; height: 170px; margin-left: -65px; }
  .egg .half { position: absolute; left: 0; right: 0; height: 50%; overflow: hidden; }
  .egg .half.up { top: 0; } .egg .half.dn { bottom: 0; }
  .egg .shell { position: absolute; left: 0; width: 130px; height: 170px; border-radius: 50% 50% 48% 48% / 60% 60% 40% 40%; background: radial-gradient(circle at 35% 30%, #fff, #f6efe0 50%, #d8ccb0); box-shadow: inset -8px -10px 0 rgba(0,0,0,.06); }
  .egg .half.dn .shell { bottom: 0; }
  .egg .shell::before, .egg .shell::after { content: ""; position: absolute; border-radius: 50%; background: var(--spot, #e8a0b0); opacity: .9; }
  .egg .shell::before { width: 26px; height: 22px; left: 26px; top: 40px; } .egg .shell::after { width: 18px; height: 16px; left: 80px; top: 100px; }
  .egg svg { position: absolute; left: 0; top: 76px; width: 130px; height: 20px; overflow: visible; }
  .egg svg path { fill: none; stroke: #5a4a2a; stroke-width: 3; stroke-dasharray: 200; stroke-dashoffset: 200; }
  .over .t-egg .egg { transform: scale(1.5); transform-origin: 50% 100%; bottom: 22%; }
  .over .t-egg .egg { animation: eggwob .22s 3 alternate .2s, eggwob .16s 4 alternate 1.1s; }
  @keyframes eggwob { from { rotate: -9deg; } to { rotate: 9deg; } }
  .over .t-egg .egg svg path { animation: crack .5s ease-out 1.0s forwards; }
  @keyframes crack { to { stroke-dashoffset: 0; } }
  .egg .leak { position: absolute; left: 0; right: 0; top: 70px; height: 30px; background: radial-gradient(ellipse, var(--c), transparent 70%); opacity: 0; filter: blur(4px); }
  .over .t-egg .leak { animation: leak .6s ease-in 1.5s forwards; }
  @keyframes leak { to { opacity: 1; transform: scale(1.8); } }
  .over .t-egg .half.up { animation: popup .6s cubic-bezier(.3,1.2,.5,1) 2.1s forwards; }
  @keyframes popup { to { transform: translate(-40px, -120px) rotate(-40deg); opacity: 0; } }
  .over .t-egg .half.dn { animation: popdn .6s ease-in 2.1s forwards; }
  @keyframes popdn { to { transform: translate(30px, 40px) rotate(20deg); opacity: 0; } }

  /* ===== 6. 星の泉 ===== */
  .t-star { background: linear-gradient(#0e1838, #22305e 60%, #3a3a6e); }
  .t-star .sky i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; animation: tw 2s infinite alternate; }
  @keyframes tw { to { opacity: .2; } }
  .t-star .moon { position: absolute; left: 30px; top: 26px; width: 44px; height: 44px; border-radius: 50%; box-shadow: 10px 6px 0 0 #fff4c0; }
  .pond { position: absolute; left: 50%; bottom: 30px; width: 240px; height: 70px; margin-left: -120px; border-radius: 50%; background: radial-gradient(ellipse at 50% 40%, #4a6ab8, #1e2e6a 70%); border: 10px solid #7a7a8a; box-shadow: inset 0 6px 12px rgba(0,0,0,.4), 0 6px 0 #4a4a5a; }
  .pond::after { content: ""; position: absolute; left: 30%; top: 20%; width: 40%; height: 20%; border-radius: 50%; background: rgba(255,255,255,.15); }
  .ring { position: absolute; left: 50%; top: 50%; width: 20px; height: 8px; margin: -4px 0 0 -10px; border: 2px solid rgba(255,255,255,.8); border-radius: 50%; opacity: 0; }
  .over .t-star .pond { transform: scale(1.4); transform-origin: 50% 100%; bottom: 18%; }
  .over .t-star .ring { animation: ripple 1.2s ease-out both; }
  @keyframes ripple { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(8); } }
  .tcoin { position: absolute; left: 20%; bottom: 10%; width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff2b8, #e8b030 55%, #a86a10); opacity: 0; }
  .over .t-star .tcoin { animation: toss .9s cubic-bezier(.3,0,.7,1) .2s both; }
  @keyframes toss { 0% { opacity: 1; transform: translate(0, 0) rotateY(0); } 50% { transform: translate(28vw, -32vh) rotateY(720deg); } 100% { opacity: 1; transform: translate(30vw, -12vh) rotateY(1440deg) scale(.5); } }
  .shoot { position: absolute; left: 110%; top: 12%; width: 160px; height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--c), transparent); box-shadow: 0 0 14px var(--c); opacity: 0; transform: rotate(-24deg); }
  .shoot::before { content: ""; position: absolute; left: -6px; top: -5px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 0 16px 6px var(--c); }
  .over .t-star .shoot { animation: shoot2 .9s ease-in 1.4s both; }
  @keyframes shoot2 { from { opacity: 1; transform: translate(0, 0) rotate(-24deg); } to { opacity: 1; transform: translate(-75vw, 34vh) rotate(-24deg); } }
  .pillar { position: absolute; left: 50%; bottom: 22%; width: 80px; height: 0; margin-left: -40px; background: linear-gradient(transparent, color-mix(in srgb, var(--c) 80%, #fff)); filter: blur(2px); opacity: 0; border-radius: 40px 40px 0 0; }
  .over .t-star .pillar { animation: pillar .7s ease-out 2.3s forwards; }
  @keyframes pillar { from { opacity: 0; height: 0; } to { opacity: .9; height: 70vh; } }
  .ssr-only { display: none; }
  .is-ssr .ssr-only { display: block; }
  .rainbow { position: absolute; inset: 0; background: conic-gradient(from 0deg, #ff5a5a, #ffd75a, #6aff8a, #5ad7ff, #b05aff, #ff5a5a); mix-blend-mode: screen; opacity: 0; pointer-events: none; }
  .is-ssr .rainbow { animation: rb 1s ease-out 2.5s both; }
  @keyframes rb { 0% { opacity: 0; } 30% { opacity: .55; } 100% { opacity: 0; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>島のガチャ（ためし）</h1>
  <p class="note">ためしに引くページです。引いた物は本当の持ち物には入りません。</p>
  <div class="lbl">デザインの案（タブで切りかえ）</div>
  <div class="row" id="themes"></div>
  <div class="wallet"><span class="coin"></span>島コイン <b id="coins">0</b><button class="add" id="add">+300（ためし用）</button></div>
  <div class="kinds"><button id="k-item" class="on">道具・素材ガチャ</button><button id="k-look">見た目ガチャ</button></div>
  <div class="machine">
    <div class="scene" id="mainScene"></div>
    <div class="panel">
      <p class="price">1 日 1 回は無料・10 回はスーパーレア以上が 1 つ確定</p>
      <div class="btns">
        <button class="free" id="b-free">きょうの無料</button>
        <button class="one" id="b-one">1 回 100</button>
        <button class="ten" id="b-ten">10 回 1000</button>
      </div>
    </div>
  </div>
  <details class="rates"><summary>出る物と確率</summary><table id="rates"></table></details>
  <div class="bag"><h2>引いた物</h2><ul id="bag"></ul></div>
</div>

<div class="over" id="over">
  <div class="scene" id="overScene"></div>
  <div class="rainbow"></div>
  <div class="flash" id="flash"></div>
  <div class="reveal" id="reveal"><div class="rays"></div><div id="revealBody"></div><button class="close" id="close">とじる</button></div>
  <button class="skip" id="skip">とばす</button>
</div>

<script>
// ── 景品（ためし）。img は icons/ の絵。見た目はまだ絵がないので絵文字で仮に出す
const RANKS = ['N', 'R', 'SR', 'SSR'];
const RANK = { N: 'ノーマル', R: 'レア', SR: 'スーパーレア', SSR: 'ウルトラレア' };
const RATE = { N: 60, R: 30, SR: 8, SSR: 2 };
const POOLS = {
  item: [
    { r: 'N', name: 'りんご', n: 3, img: 'apple' },
    { r: 'N', name: '原木', n: 8, img: 'log' },
    { r: 'N', name: '羊毛', n: 2, img: 'wool' },
    { r: 'N', name: '革', n: 2, img: 'leather' },
    { r: 'R', name: '鉄鉱石', n: 3, img: 'iron' },
    { r: 'R', name: '金鉱石', n: 2, img: 'gold' },
    { r: 'SR', name: 'ダイヤ', n: 1, img: 'diamond' },
    { r: 'SR', name: '星のかけら', n: 1, img: 'star_shard' },
    { r: 'SR', name: '虹色の貝', n: 1, img: 'rainbow_shell' },
    { r: 'SSR', name: '黄金の魚', n: 1, img: 'golden_fish' },
    { r: 'SSR', name: '竜のうろこ', n: 1, img: 'dragon_scale' },
  ],
  look: [
    { r: 'N', name: '麦わら帽子', emo: '👒' },
    { r: 'N', name: '青いつなぎ', emo: '👖' },
    { r: 'N', name: '赤いマフラー', emo: '🧣' },
    { r: 'R', name: '花かんむり', emo: '💐' },
    { r: 'R', name: 'しましまシャツ', emo: '👕' },
    { r: 'R', name: 'まるメガネ', emo: '👓' },
    { r: 'SR', name: '魔法使いの帽子', emo: '🎩' },
    { r: 'SR', name: '騎士のマント', emo: '🧥' },
    { r: 'SSR', name: '金の王冠', emo: '👑' },
    { r: 'SSR', name: '虹色の服', emo: '🌈' },
  ],
};
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const COL = { N: css('--N'), R: css('--R'), SR: css('--SR'), SSR: css('--SSR') };

// ── デザインの案：main＝ふだんの機械、scene＝引いた時の演出（CSS のアニメ）、dur＝演出の長さ（ミリ秒）
const rnd = (a, b) => a + Math.random() * (b - a);
const THEMES = [
  { id: 'capsule', name: 'カプセル', dur: 3000,
    html: (big) => `<div class="scene t-capsule"><div class="lights">${'<i></i>'.repeat(9)}</div>
      <div class="cap-mc"><div class="cap-dome">${capsules()}</div><div class="cap-body"><div class="knob"></div><div class="out"></div><div class="plate">ISLAND GACHA</div></div></div>
      ${big ? '<div class="ball"></div>' : ''}</div>` },
  { id: 'gara', name: 'ガラガラ', dur: 3200,
    html: (big) => `<div class="scene t-gara"><div class="curtain"></div><div class="sign">島の福引き</div>
      <div class="gara"><div class="drum">${drumSvg()}</div><div class="stand"></div><div class="tray"></div>${big ? '<div class="gball"></div>' : ''}</div>
      ${big ? '<div class="bell">カランカラン！</div>' : ''}</div>` },
  { id: 'omi', name: 'おみくじ', dur: 3300,
    html: (big) => `<div class="scene t-omi"><div class="torii"><div class="beam"></div></div>${petals(big ? 14 : 7)}
      <div class="omi"><div class="stick"></div><div class="box"></div></div>${big ? '<div class="scroll" id="scrollTxt"></div>' : ''}</div>` },
  { id: 'fish', name: '海の釣り', dur: 3100,
    html: (big) => `<div class="scene t-fish"><div class="sun"></div><div class="boat"></div>
      <div class="wave" style="top:36%"></div><div class="wave" style="top:56%;animation-duration:4s;opacity:.7"></div><div class="wave" style="top:76%;animation-duration:5s;opacity:.5"></div>
      <div class="line"></div><div class="bob"></div>${big ? `<div class="bang">！</div><div class="splash">${drops()}</div><div class="orb"></div>` : ''}</div>` },
  { id: 'egg', name: 'たまご', dur: 2900,
    html: (big) => `<div class="scene t-egg"><div class="grass"></div><div class="nest"></div>
      <div class="egg"><div class="half up"><div class="shell"></div></div><div class="half dn"><div class="shell"></div></div>
      <svg viewBox="0 0 130 20"><path d="M2 10 L18 2 L30 16 L46 4 L60 15 L74 3 L88 16 L102 4 L116 14 L128 8"/></svg><div class="leak"></div></div></div>` },
  { id: 'star', name: '星の泉', dur: 3300,
    html: (big) => `<div class="scene t-star"><div class="sky">${stars(big ? 60 : 30)}</div><div class="moon"></div>
      ${big ? '<div class="tcoin"></div><div class="shoot"></div><div class="pillar"></div>' : ''}
      <div class="pond">${big ? '<div class="ring" style="animation-delay:1.05s"></div><div class="ring" style="animation-delay:1.3s"></div><div class="ring" style="animation-delay:1.55s"></div>' : ''}</div></div>` },
];
function capsules() {
  const cols = ['#e85a4f', '#3f8fd6', '#f0c030', '#5cb85c', '#a35bd6', '#ff8ac0'];
  let h = '';
  for (let i = 0; i < 15; i++) { const x = 6 + (i * 41) % 156, y = 120 - Math.floor(i / 4) * 30 - (i % 2) * 10; h += `<i style="left:${x}px;top:${y}px;background:${cols[(i * 5) % 6]};animation-delay:${(i % 4) * .05}s"></i>`; }
  return h;
}
function drumSvg() {
  const pts = [...Array(8)].map((_, i) => { const a = Math.PI / 8 + i * Math.PI / 4; return `${80 + 70 * Math.cos(a)},${80 + 70 * Math.sin(a)}`; }).join(' ');
  return `<svg viewBox="0 0 160 160" width="160" height="160"><polygon points="${pts}" fill="#d8302a" stroke="#7a1c18" stroke-width="6"/>
    <polygon points="${pts}" fill="none" stroke="#ffd060" stroke-width="3" transform="translate(80 80) scale(.78) translate(-80 -80)"/>
    <circle cx="80" cy="80" r="14" fill="#ffd060" stroke="#7a1c18" stroke-width="4"/><rect x="76" y="6" width="8" height="40" rx="4" fill="#7a1c18"/></svg>`;
}
function petals(n) { let h = ''; for (let i = 0; i < n; i++) h += `<i class="petal" style="left:${rnd(5, 100)}%;top:${rnd(-20, 0)}%;animation-delay:${rnd(0, 6)}s;animation-duration:${rnd(5, 8)}s"></i>`; return h; }
function stars(n) { let h = ''; for (let i = 0; i < n; i++) h += `<i style="left:${rnd(0, 100)}%;top:${rnd(0, 60)}%;animation-delay:${rnd(0, 2)}s;transform:scale(${rnd(.5, 1.4)})"></i>`; return h; }
function drops() { let h = ''; for (let i = 0; i < 9; i++) { const a = -Math.PI * (0.15 + 0.7 * i / 8); h += `<i style="--dx:${Math.cos(a) * 90}px;--dy:${Math.sin(a) * 110}px"></i>`; } return h; }

// ── 保存（このブラウザだけ。ためし用）
const KEY = 'town.gachaTest2';
const today = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10); // 日本の日付
let S = { coins: 300, free: {}, bag: {}, theme: 'capsule' };
try { S = Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

let kind = 'item';
const $ = (id) => document.getElementById(id);
const theme = () => THEMES.find((t) => t.id === S.theme) || THEMES[0];
function icon(p, cls = '') {
  if (p.img) return `<img class="${cls}" src="icons/${p.img}.png" alt="">`;
  return `<span class="ph ${cls}">${p.emo}</span>`;
}
function pickRank() { let x = Math.random() * 100; for (const r of ['SSR', 'SR', 'R', 'N']) { if (x < RATE[r]) return r; x -= RATE[r]; } return 'N'; }
function pull(minSR = false) {
  let r = pickRank();
  if (minSR && (r === 'N' || r === 'R')) r = 'SR';
  const list = POOLS[kind].filter((p) => p.r === r);
  return list[Math.floor(Math.random() * list.length)];
}

function renderTop() {
  $('coins').textContent = S.coins;
  const usedFree = S.free[kind] === today();
  $('b-free').disabled = usedFree; $('b-free').textContent = usedFree ? '無料はまた明日' : 'きょうの無料';
  $('b-one').disabled = S.coins < 100; $('b-ten').disabled = S.coins < 1000;
  $('k-item').classList.toggle('on', kind === 'item'); $('k-look').classList.toggle('on', kind === 'look');
  $('themes').innerHTML = THEMES.map((t, i) => `<button data-t="${t.id}" class="${t.id === S.theme ? 'on' : ''}">${i + 1}. ${t.name}</button>`).join('');
  $('mainScene').innerHTML = theme().html(false);
  $('rates').innerHTML = ['SSR', 'SR', 'R', 'N'].map((r) => `<tr><td style="white-space:nowrap"><span class="tag" style="background:${COL[r]}">${r}</span> ${RATE[r]}%</td><td>${POOLS[kind].filter((p) => p.r === r).map((p) => p.name + (p.n > 1 ? ' ×' + p.n : '')).join('・')}</td></tr>`).join('');
}
// 「引いた物」は、演出を見てとじた後に新しくする（引いた瞬間に中身が見えないように）
function renderBag() {
  const all = [...POOLS.item, ...POOLS.look];
  $('bag').innerHTML = Object.entries(S.bag).map(([nm, c]) => { const p = all.find((q) => q.name === nm) || { emo: '🎁' }; return `<li>${icon(p, 'ico')}${nm} ×${c}</li>`; }).join('') || '<li style="color:var(--sub)">まだありません</li>';
}

let pending = null, timers = [];
const later = (fn, ms) => timers.push(setTimeout(fn, ms));
function play(results) {
  pending = results;
  save(); renderTop();
  const best = results.reduce((a, b) => (RANKS.indexOf(b.r) > RANKS.indexOf(a.r) ? b : a));
  const over = $('over'), th = theme();
  over.style.setProperty('--c', COL[best.r]);
  over.classList.toggle('is-ssr', best.r === 'SSR');
  $('overScene').innerHTML = th.html(true);
  const sc = $('scrollTxt'); if (sc) sc.textContent = { N: '吉', R: '中吉', SR: '大吉', SSR: '超大吉' }[best.r];
  $('reveal').classList.remove('on'); $('close').classList.remove('on'); $('skip').style.display = '';
  over.classList.add('on');
  later(() => reveal(results), th.dur);
}
function reveal(results) {
  timers.forEach(clearTimeout); timers = [];
  $('skip').style.display = 'none';
  const f = $('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
  const rv = $('reveal'), body = $('revealBody');
  if (results.length === 1) {
    const p = results[0];
    rv.style.setProperty('--c', COL[p.r]);
    body.innerHTML = `<div class="one-prize"><div class="rk">${RANK[p.r]}</div><div class="halo">${icon(p)}</div><div class="nm">${p.name}${p.n > 1 ? ' ×' + p.n : ''}</div></div>`;
    rv.classList.add('on');
    later(() => $('close').classList.add('on'), 600);
  } else {
    const best = results.reduce((a, b) => (RANKS.indexOf(b.r) > RANKS.indexOf(a.r) ? b : a));
    rv.style.setProperty('--c', COL[best.r]);
    body.innerHTML = `<div class="grid10">${results.map((p) => `<div class="card" style="--c:${COL[p.r]}"><div class="back">？</div><div class="front">${icon(p)}<span>${p.name}</span><b>${p.r}</b></div></div>`).join('')}</div>`;
    rv.classList.add('on');
    [...body.querySelectorAll('.card')].forEach((c, i) => later(() => c.classList.add('flip'), 400 + i * 220));
    later(() => $('close').classList.add('on'), 400 + results.length * 220 + 300);
  }
}
$('skip').onclick = () => reveal(pending);
$('close').onclick = () => { $('over').classList.remove('on'); renderBag(); };
$('b-free').onclick = () => { S.free[kind] = today(); const p = pull(); give(p); play([p]); };
$('b-one').onclick = () => { S.coins -= 100; const p = pull(); give(p); play([p]); };
$('b-ten').onclick = () => { S.coins -= 1000; const rs = []; for (let i = 0; i < 10; i++) rs.push(pull(i === 9 && !rs.some((p) => p.r === 'SR' || p.r === 'SSR'))); rs.forEach(give); play(rs); };
function give(p) { S.bag[p.name] = (S.bag[p.name] || 0) + (p.n || 1); }
$('add').onclick = () => { S.coins += 300; save(); renderTop(); };
$('k-item').onclick = () => { kind = 'item'; renderTop(); };
$('k-look').onclick = () => { kind = 'look'; renderTop(); };
$('themes').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; S.theme = b.dataset.t; save(); renderTop(); };
renderTop(); renderBag();
</script>
</body>
</html>
