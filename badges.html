<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>バッジ | はじまり島</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e2a4f">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="はじまり島">
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));</script>
</head>
<body>
<main class="wrap">
  <h1>バッジ</h1>
  <p class="muted">村人は、島でがんばるとバッジをもらえます。色がついているのは、だれかが持っているバッジ。灰色はまだだれも持っていないバッジで、もらい方が書いてあります。</p>
  <div id="empty"></div>
  <h2>称号バッジ</h2>
  <p class="muted">1 人 1 回だけもらえて、なくなりません。</p>
  <ul class="bdglist" id="titles"></ul>
  <h2>技能バッジ</h2>
  <p class="muted">数がふえると 銅 → 銀 → 金 → ダイヤ に変わります。</p>
  <ul class="bdglist" id="skills"></ul>
</main>
<script type="module">
import { loadAll, nav, esc, villagerUrl, showError, emptyNote } from './js/common.js';
import { versusTitles } from './js/versus.js';
nav('badges.html');
const FIRST = 3; // 名前は 3 人まで出して、あとは「もっと見る」で開く
loadAll().then((D) => {
  if (!D.active.length) document.getElementById('empty').innerHTML = emptyNote(D.config);
  const link = (v) => `<a href="${villagerUrl(v)}">${esc(v.display)}</a>`;
  // 名前は 1 人ずつ折り返す（横にはみ出さない）。4 人目からは閉じておく
  const names = (vs) => `<span class="names">${vs.slice(0, FIRST).map(link).join(' ')}</span>` +
    (vs.length > FIRST ? `<span class="names more" hidden>${vs.slice(FIRST).map(link).join(' ')}</span><button type="button" class="morebtn" data-n="${vs.length - FIRST}">もっと見る（ほか ${vs.length - FIRST} 人）</button>` : '');
  document.addEventListener('click', (e) => {
    const b = e.target.closest('.morebtn'); if (!b) return;
    const m = b.previousElementSibling, open = m.hidden;
    m.hidden = !open; b.textContent = open ? 'とじる' : `もっと見る（ほか ${b.dataset.n} 人）`;
  });
  const img = (src, alt, size) => src ? `<img class="bdgimg pixel" src="${esc(src)}" alt="${esc(alt)}" width="${size}" height="${size}" decoding="async">` : '';

  // ---- 称号バッジ（config.titles.list と、対決投票の称号 config.versus。対決の称号は、だれかが持っている物だけ出す） ----
  const TL = (D.config.titles && D.config.titles.list) || [];
  const VT = versusTitles(D.config).filter((t) => D.active.some((v) => (v.titles || []).includes(t.id)));
  document.getElementById('titles').innerHTML = [...TL, ...VT].map((t) => {
    const own = D.active.filter((v) => (v.titles || []).includes(t.id));
    const has = own.length > 0;
    return `<li class="bdgcard${has ? '' : ' none'}">${t.img ? img(t.img, t.name, 96) : `<span class="bdgtxt">${esc(t.icon || '★')}</span>`}<div>` +
      `<h3>${esc(t.name)}</h3><p>${esc(t.desc || '')}</p>` +
      (has ? `<p class="who">持っている人（${own.length} 人）：${names(own)}</p>`
        : `<p class="muted">まだだれも持っていません。もらい方：${esc(t.how || t.desc || '')}</p>`) +
      '</div></li>';
  }).join('') || '<li class="muted">称号はまだありません。</li>';

  // ---- 技能バッジ（config.badges。段つき） ----
  const BG = D.config.badges;
  const SL = BG && BG.list ? Object.entries(BG.list) : [];
  const tierOf = (v, id) => { const L = D.life[v.key]; const t = L && L.badges ? L.badges[id] : undefined; return t == null ? -1 : t; };
  document.getElementById('skills').innerHTML = SL.map(([id, B]) => {
    if (B.founder) {
      // 称号バッジを持っている人は、はじまりの住人を重ねて出さない（町のカード・村人ページと同じ）
      const own = D.active.filter((v) => tierOf(v, id) >= 0 && !(v.titles || []).some((t) => TL.some((x) => x.id === t)));
      return `<li class="bdgcard${own.length ? '' : ' none'}">${img(`icons/badge_${id}.png`, B.name, 96)}<div><h3>${esc(B.name)}</h3><p>${esc(B.note || '')}</p>` +
        (own.length ? `<p class="who">持っている人（${own.length} 人）：${names(own)}</p>` : '<p class="muted">まだだれも持っていません。</p>') +
        '<p class="muted">称号バッジを持っている人は、そちらの絵だけを出します。</p></div></li>';
    }
    const unit = B.unit || '';
    const tiers = B.tiers.map((n, i) => {
      const k = D.active.filter((v) => tierOf(v, id) === i).length;
      const any = D.active.some((v) => tierOf(v, id) >= i);
      return `<figure class="${any ? '' : 'none'}">${img(`icons/badge_${id}_${i}.png`, `${B.name}（${BG.tierNames[i]}）`, 48)}<figcaption>${esc(BG.tierNames[i])}<br>${n}${esc(unit.trim())}${k ? `<br><b>${k} 人</b>` : ''}</figcaption></figure>`;
    }).join('');
    // 持っている人は段の高い順
    const own = D.active.filter((v) => tierOf(v, id) >= 0).sort((a, b) => tierOf(b, id) - tierOf(a, id));
    return `<li class="bdgcard${own.length ? '' : ' none'}"><div><h3>${esc(B.name)}</h3><p>${esc(B.note || '')}が ふえると もらえます。</p><div class="tiers">${tiers}</div>` +
      (own.length ? `<p class="who">持っている人（${own.length} 人）：${names(own)}</p>` : `<p class="muted">まだだれも持っていません。もらい方：${esc(B.note || '')}が ${B.tiers[0]}${esc(unit.trim())} になると銅。</p>`) +
      '</div></li>';
  }).join('') || '<li class="muted">技能バッジはまだありません。</li>';
}).catch(showError);
</script>
</body>
</html>
