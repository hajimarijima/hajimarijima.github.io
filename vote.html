<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>投票 | はじまり島</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7cb342">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="はじまり島">
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));</script>
</head>
<body>
<main class="wrap">
  <h1>次に何を作る？</h1>
  <div class="card">
    <div class="muted">今のフォロワー</div>
    <div class="big" id="followers"></div>
  </div>
  <div id="current"></div>
  <h2>これまでの投票</h2>
  <div id="past"></div>
  <h2>建ててほしい物</h2>
  <p class="muted">「図書館たててほしい」「温泉ほしい」のようにコメントしてください。数えておいて、次の A・B・C の候補を選ぶ時の参考にします（投票の結果は変わりません）。</p>
</main>
<script type="module">
import { loadAll, nav, esc, fmtDate, showError } from './js/common.js';
nav('vote.html');
const JST = (iso) => { const d = new Date(Date.parse(iso) + 9 * 3600e3); return { m: d.getUTCMonth() + 1, d: d.getUTCDate(), h: d.getUTCHours() }; };
const COL = { A: 'var(--A)', B: 'var(--B)', C: 'var(--C)' };

function options(vote) {
  const total = vote.votes.A + vote.votes.B + vote.votes.C;
  const max = Math.max(vote.votes.A, vote.votes.B, vote.votes.C);
  return vote.options.map((o) => {
    const n = vote.votes[o.key];
    const pct = total ? Math.round((n / total) * 1000) / 10 : 0;
    const win = vote.key ? vote.key === o.key : false;
    return `<div class="opt"><div class="k" style="background:${COL[o.key]}">${o.key}</div><div>
      <b>${esc(o.name)}</b>${win ? ' <span class="tag">決まり</span>' : ''}<div class="muted">${esc(o.desc || '')}</div>
      <div class="bar"><i style="width:${pct}%;background:${COL[o.key]}"></i></div>
      <div class="num">${n} 票（${pct}%）</div></div></div>`;
  }).join('');
}

// 時間ごとの票の伸び（折れ線）
function chart(timeline) {
  if (!timeline || timeline.length < 2) return '<p class="muted">票が集まると、ここに伸び方の線が出ます。</p>';
  const W = 340, H = 150, pl = 28, pr = 8, pt = 10, pb = 24;
  const max = Math.max(1, ...timeline.flatMap((p) => [p.A, p.B, p.C]));
  const x = (i) => pl + (i / (timeline.length - 1)) * (W - pl - pr);
  const y = (n) => pt + (1 - n / max) * (H - pt - pb);
  const line = (k) => `<polyline fill="none" stroke="${COL[k]}" stroke-width="2.5" stroke-linejoin="round" points="${timeline.map((p, i) => x(i).toFixed(1) + ',' + y(p[k]).toFixed(1)).join(' ')}"/>`;
  const ticks = [0, Math.round(max / 2), max].map((n) => `<text x="${pl - 6}" y="${y(n) + 4}" font-size="10" text-anchor="end" fill="#6f6656">${n}</text><line x1="${pl}" x2="${W - pr}" y1="${y(n)}" y2="${y(n)}" stroke="#e2d9c6"/>`).join('');
  const lab = (i) => { const d = JST(timeline[i].t); return `${d.m}/${d.d} ${d.h}時`; };
  const xl = [0, timeline.length - 1].map((i) => `<text x="${x(i)}" y="${H - 6}" font-size="10" text-anchor="${i ? 'end' : 'start'}" fill="#6f6656">${lab(i)}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="時間ごとの票の伸び">${ticks}${line('A')}${line('B')}${line('C')}${xl}</svg>
    <div class="legend">${['A', 'B', 'C'].map((k) => `<span><i class="dot" style="background:${COL[k]}"></i>${k}</span>`).join('')}</div>`;
}

loadAll().then(({ state, config }) => {
  document.getElementById('followers').textContent = state.followers.toLocaleString() + ' 人';

  const cur = document.getElementById('current');
  const votes = state.votes || (state.vote ? [state.vote] : []);
  const what = { what: '何を建てる？', where: 'どこに建てる？', tool: 'どの道具を作る？' };
  cur.innerHTML = votes.length ? votes.map((v) => {
    const total = v.votes.A + v.votes.B + v.votes.C;
    const op = JST(v.opensAt), close = JST(v.closesAt);
    return `<h2>投票中：${esc(v.question || what[v.kind] || '')}</h2>
      <div class="howto">投票の投稿に、<b>A・B・C</b> のどれか 1 つをコメントしてください。1 人 1 票で、何度か書いたら最後のコメントを数えます。受け付けは <b>${op.m}月${op.d}日 ${op.h}時〜${close.m}月${close.d}日 ${close.h}時</b>（日本時間）です。</div>
      <div class="card" style="margin-top:12px">${options(v)}
      <p class="muted" style="margin-bottom:0">${v.voters} 人が投票・合計 ${total} 票</p></div>
      <h2>時間ごとの票の伸び</h2><div class="card">${chart(v.timeline)}</div>`;
  }).join('') : '<h2>いまは投票していません</h2><p class="muted">今の建物ができたら、次の「何を建てる？」が始まります。</p>';

  document.getElementById('past').innerHTML = state.decisions.length ? state.decisions.slice().reverse().map((d) => `
    <div class="card" style="margin-bottom:12px">
      <b>${esc(d.question || what[d.kind] || (d.milestone ? 'フォロワー ' + d.milestone + ' 人の節目' : ''))}</b>（${d.day}日目に決定）：<b>${esc(d.key + ' ' + d.name)}</b>${d.tie ? '（同点のためくじ引き）' : ''}
      ${options(d)}
      <p class="muted">${d.voters} 人が投票</p>
      <details><summary>時間ごとの票の伸び</summary>${chart(d.timeline)}</details>
    </div>`).join('') : '<p class="muted">まだありません。</p>';
}).catch(showError);
</script>
</body>
</html>
