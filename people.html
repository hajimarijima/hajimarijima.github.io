<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>村人の一覧 | はじまり島</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e2a4f">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="はじまり島">
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));</script>
</head>
<body>
<main class="wrap">
  <h1>村人の一覧</h1>
  <form class="vsearch" id="vsearch" role="search" autocomplete="off">
    <label for="vq">自分の村人をさがす</label>
    <div class="vsrow">
      <input type="search" id="vq" inputmode="search" enterkeyhint="search" placeholder="インスタのユーザー名・あだ名（@ はなくても OK）" maxlength="40" autocapitalize="off" spellcheck="false">
      <button type="submit" class="btn">さがす</button>
    </div>
    <p class="muted" id="vsmsg" aria-live="polite"></p>
    <div id="vsres"></div>
  </form>
  <p class="muted" id="count"></p>
  <div class="people" id="list"></div>
</main>
<script type="module">
import { loadAll, nav, esc, villagerUrl, JOB, faceCanvas, showError, emptyNote, gaugeHtml, loadDiary, titleBadges } from './js/common.js';
import { searchVillagers, findExact, igUrl, normQ } from './js/search.js';
import { hourOf, hourText } from './js/hours.js';
import { slotsHtml, heldOf } from './js/invslots.js';
nav('people.html');
// ---------- 村人さがし（インスタのユーザー名・あだ名の一部。?who=名前 でその人のカードを開く） ----------
function setupSearch(D) {
  const form = document.getElementById('vsearch'), q = document.getElementById('vq'), msg = document.getElementById('vsmsg'), res = document.getElementById('vsres');
  const qs = new URLSearchParams(location.search);
  const hq = Number(qs.get('hour'));
  const hour = qs.has('hour') && Number.isFinite(hq) ? ((Math.floor(hq) % 24) + 24) % 24 : (new Date().getUTCHours() + 9) % 24;
  const max = (D.config.needs || {}).max || 20, IC = D.config.inventory || {};
  const startOpt = (id) => ((D.config.startTools && D.config.startTools.options) || []).find((o) => o.id === id);
  async function card(v) {
    const L = D.life[v.key] || {};
    const o = startOpt(v.startTool || L.startTool);
    const diary = await loadDiary(v.key, L);
    const today = diary.filter((d) => d.day === D.state.day).pop() || diary[diary.length - 1];
    const ig = igUrl(v);
    const el = document.createElement('article'); el.className = 'card vres';
    el.innerHTML = `<div class="vhead"><span class="vface"></span><div><h2>${esc(v.display)}</h2>${titleBadges(v, D.config, L)}` +
      `<small class="muted">${v.body === 'chibi' ? '2 頭身' : '通常の体'}・${esc(o ? o.job + '（木の' + o.label + '）' : JOB[L.job] || 'まだ仕事なし')}</small></div></div>` +
      `<dl class="info vinfo">` +
      `<dt>レベル</dt><dd>Lv${L.level || 1}・持ち物の枠 ${L.slots || IC.base || 3}/${IC.max || 9}</dd>` +
      `<dt>持ち物</dt><dd>${slotsHtml(L, D.config)}<small class="muted">${esc(heldOf(L).label)}</small></dd>` +
      `<dt>朝型・夜型</dt><dd>${esc(L.chrono || 'ふつう')}</dd>` +
      `<dt>${hour}時の今</dt><dd>${esc(hourText(hourOf(L, hour)) || '—')}</dd>` +
      `<dt>きょうの日記</dt><dd>${esc(today ? today.text : 'まだありません')}</dd>` +
      `<dt>体力</dt><dd>${gaugeHtml('heart', L.hp, max)}</dd>` +
      `<dt>おなか</dt><dd>${gaugeHtml('food', L.hunger, max)}</dd>` +
      `<dt>ベッド</dt><dd>${L.bed ? 'あり' : 'まだなし（木かげや地面で寝る）'}</dd></dl>` +
      `<div class="vlinks"><a class="btn" href="${villagerUrl(v)}">くわしく見る</a>` +
      (ig ? `<a class="btn sub" href="${esc(ig)}" target="_blank" rel="noopener">Instagram を見る</a>` : '') + '</div>';
    faceCanvas(v, 48).then((c) => el.querySelector('.vface').append(c));
    return el;
  }
  async function run(text, exact) {
    const n = normQ(text);
    res.textContent = '';
    if (!n) { msg.textContent = ''; return; }
    const hits = exact ? [findExact(D.active, text)].filter(Boolean) : searchVillagers(D.active, text, 8);
    // 15 分ごとの受付（tools/join.js）で登録されて、まだ町に来ていない人
    const waiting = D.villagers.filter((v) => v.joinedDay > D.state.day);
    const wait = hits.length ? null : (exact ? findExact(waiting, text) : searchVillagers(waiting, text, 1)[0]);
    if (wait) { msg.textContent = `${wait.display} さん、受付ずみです。まもなく（15 分ほどで）町に住み始めます。`; return; }
    msg.textContent = hits.length ? (hits.length === 1 ? '見つかりました。' : `${hits.length} 人見つかりました。`) : '見つかりませんでした。名前を少し短くして、もう一度さがしてください。（コメントしてから 15 分ほどで受付されます）';
    for (const v of hits) res.append(await card(v));
  }
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const u = new URL(location.href);
    if (normQ(q.value)) u.searchParams.set('q', q.value.trim()); else u.searchParams.delete('q');
    u.searchParams.delete('who');
    history.replaceState(null, '', u);
    run(q.value, false);
  });
  const who = qs.get('who'), q0 = qs.get('q');
  if (who) { q.value = who; run(who, true); }
  else if (q0) { q.value = q0; run(q0, false); }
}
loadAll().then(async (D) => {
  setupSearch(D);
  if (!D.active.length) document.getElementById('count').innerHTML = emptyNote(D.config);
  else document.getElementById('count').textContent = `${D.active.length} 人が住んでいます。名前をえらぶと、くわしいページへ行けます。`;
  const box = document.getElementById('list');
  // 人が多い時は 1 ページ PER 人ずつ出す（顔の絵を一度に全部作らない）
  const PER = 60;
  const all = D.active.slice().sort((a, b) => a.joinedDay - b.joinedDay);
  const pages = Math.ceil(all.length / PER);
  let page = Math.max(0, Math.min(pages - 1, (+new URLSearchParams(location.search).get('page') || 1) - 1)), run = 0;
  const pager = document.createElement('div'); pager.className = 'pager';
  async function show() {
    const me = ++run;
    box.textContent = '';
    for (const v of all.slice(page * PER, page * PER + PER)) {
      const L = D.life[v.key] || {};
      const a = document.createElement('a');
      a.className = 'person'; a.href = villagerUrl(v);
      const face = await faceCanvas(v, 32);
      if (me !== run) return; // 途中でページを変えた
      a.append(face);
      const s = document.createElement('span');
      s.innerHTML = `<b>${esc(v.display)}</b>${titleBadges(v, D.config, L)}<small>${esc(JOB[L.job] || '')}・${v.joinedDay}日目から</small>`;
      a.append(s); box.append(a);
    }
    pager.innerHTML = pages > 1 ? `<button class="btn" data-d="-1" ${page ? '' : 'disabled'}>前へ</button><span>${page + 1} / ${pages} ページ</span><button class="btn" data-d="1" ${page < pages - 1 ? '' : 'disabled'}>次へ</button>` : '';
  }
  pager.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-d]'); if (!b) return;
    page += +b.dataset.d; history.replaceState(null, '', '?page=' + (page + 1)); show(); scrollTo(0, 0);
  });
  box.after(pager);
  show();
}).catch(showError);
</script>
</body>
</html>
