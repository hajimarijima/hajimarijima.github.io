<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>村人の一覧 | はじまり島</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7cb342">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="はじまり島">
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));</script>
</head>
<body>
<main class="wrap">
  <h1>村人の一覧</h1>
  <p class="muted" id="count"></p>
  <div class="people" id="list"></div>
</main>
<script type="module">
import { loadAll, nav, esc, villagerUrl, JOB, faceCanvas, showError, emptyNote } from './js/common.js';
nav('people.html');
loadAll().then(async (D) => {
  if (!D.active.length) document.getElementById('count').innerHTML = emptyNote(D.config);
  else document.getElementById('count').textContent = `${D.active.length} 人が住んでいます。名前をえらぶと、くわしいページへ行けます。`;
  const box = document.getElementById('list');
  // 人が多い時は 1 ページ PER 人ずつ出す（顔の絵を一度に全部作らない）
  const PER = 60;
  const all = D.active.slice().sort((a, b) => a.joinedDay - b.joinedDay);
  const pages = Math.ceil(all.length / PER);
  let page = Math.max(0, Math.min(pages - 1, (+new URLSearchParams(location.search).get('page') || 1) - 1)), run = 0;
  const pager = document.createElement('div'); pager.className = 'pager';
  async function show() {
    const me = ++run;
    box.textContent = '';
    for (const v of all.slice(page * PER, page * PER + PER)) {
      const L = D.life[v.key] || {};
      const a = document.createElement('a');
      a.className = 'person'; a.href = villagerUrl(v);
      const face = await faceCanvas(v, 32);
      if (me !== run) return; // 途中でページを変えた
      a.append(face);
      const s = document.createElement('span');
      s.innerHTML = `<b>${esc(v.display)}</b><small>${esc(JOB[L.job] || '')}・${v.joinedDay}日目から</small>`;
      a.append(s); box.append(a);
    }
    pager.innerHTML = pages > 1 ? `<button class="btn" data-d="-1" ${page ? '' : 'disabled'}>前へ</button><span>${page + 1} / ${pages} ページ</span><button class="btn" data-d="1" ${page < pages - 1 ? '' : 'disabled'}>次へ</button>` : '';
  }
  pager.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-d]'); if (!b) return;
    page += +b.dataset.d; history.replaceState(null, '', '?page=' + (page + 1)); show(); scrollTo(0, 0);
  });
  box.after(pager);
  show();
}).catch(showError);
</script>
</body>
</html>
